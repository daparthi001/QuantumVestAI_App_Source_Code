name: Deploy QuantumVestAI with Terraform and Docker

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "docs/**"
      
  workflow_dispatch:
    inputs:
      action:
        description: "Choose action (deploy or destroy)"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - destroy
      environment:
        description: "Deployment environment"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod
      init_db:
        description: "Initialize database"
        required: false
        default: 'false'
        type: boolean
      seed_data:
        description: "Seed sample data (dev/staging only)"
        required: false
        default: 'false'
        type: boolean

jobs:
  deploy:
    if: ${{ github.event.inputs.action == 'deploy' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}

    env:
      ECR_REPOSITORY: quantumvestai
      AWS_REGION: us-east-1
      CLUSTER_NAME: quantumvestai-cluster
      IMAGE_TAG: ${{ github.sha }}
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.7

    - name: Terraform Init, Validate, Plan, and Apply
      working-directory: ci-cd/terraform
      run: |
        terraform init -upgrade
        #terraform plan -var="environment=${{ env.ENVIRONMENT }}" -var="aws_region=${{ env.AWS_REGION }}"
        #terraform apply -var="environment=${{ env.ENVIRONMENT }}" -var="aws_region=${{ env.AWS_REGION }}" -auto-approve

    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    # Ensure ECR repository exists
    - name: Ensure ECR Repository exists
      run: |
        aws ecr describe-repositories --repository-names ${ECR_REPOSITORY} --region ${AWS_REGION} || \
          aws ecr create-repository --repository-name ${ECR_REPOSITORY} --region ${AWS_REGION}

    # Build and push DB init image with updated path
    - name: Build, tag, and push DB Init Docker image
      run: |
        docker build -t ${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:db-init-${IMAGE_TAG} -f ./ai-stock-platform/api/Dockerfile.db-init ./ai-stock-platform/api
        docker tag ${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:db-init-${IMAGE_TAG} ${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:db-init-${ENVIRONMENT}-latest
        docker push ${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:db-init-${IMAGE_TAG}
        docker push ${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:db-init-${ENVIRONMENT}-latest
        echo "DB_INIT_IMAGE=${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:db-init-${IMAGE_TAG}" >> $GITHUB_ENV

    # Build and push API image with updated path
    - name: Build, tag, and push API Docker image
      working-directory: ai-stock-platform/api
      run: |
        docker build -t ${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:api-${IMAGE_TAG} .
        docker tag ${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:api-${IMAGE_TAG} ${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:api-${ENVIRONMENT}-latest
        docker push ${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:api-${IMAGE_TAG}
        docker push ${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:api-${ENVIRONMENT}-latest
        echo "API_IMAGE=${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:api-${IMAGE_TAG}" >> $GITHUB_ENV

    # Build and push UI image with updated path
    - name: Build, tag, and push UI Docker image
      working-directory: ai-stock-platform/ui
      run: |
        docker build -t ${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:ui-${IMAGE_TAG} .
        docker tag ${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:ui-${IMAGE_TAG} ${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:ui-${ENVIRONMENT}-latest
        docker push ${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:ui-${IMAGE_TAG}
        docker push ${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:ui-${ENVIRONMENT}-latest
        echo "UI_IMAGE=${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:ui-${IMAGE_TAG}" >> $GITHUB_ENV

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region $AWS_REGION --name $CLUSTER_NAME

    - name: Validate EKS Connection
      run: |
        kubectl get nodes

