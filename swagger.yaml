            enum: [1d, 1w, 1m, 3m, 6m, 1y, ytd]
            default: "1m"
      responses:
        '200':
          description: Sector performance retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectorPerformanceResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/data/industries/performance:
    get:
      tags:
        - Data
      summary: Get industry performance
      description: Get performance metrics for different industries
      parameters:
        - name: period
          in: query
          required: false
          description: Performance period
          schema:
            type: string
            enum: [1d, 1w, 1m, 3m, 6m, 1y, ytd]
            default: "1m"
        - name: sector
          in: query
          required: false
          description: Filter by sector
          schema:
            type: string
            enum: [Technology, Healthcare, Financial, Consumer, Energy, Industrials, Materials, Utilities, Real Estate, Telecommunications]
      responses:
        '200':
          description: Industry performance retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndustryPerformanceResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Social Media APIs (Twitter Integration)
  /api/social/twitter/sentiment/{symbol}:
    get:
      tags:
        - Social Media
      summary: Get Twitter sentiment for stock
      description: Analyze Twitter sentiment for a specific stock symbol
      parameters:
        - name: symbol
          in: path
          required: true
          description: Stock symbol
          schema:
            type: string
            pattern: '^[A-Z]{1,5}$'
            example: "AAPL"
        - name: days
          in: query
          required: false
          description: Number of days to analyze
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 7
        - name: max_tweets
          in: query
          required: false
          description: Maximum tweets to analyze
          schema:
            type: integer
            minimum: 100
            maximum: 1000
            default: 500
      responses:
        '200':
          description: Twitter sentiment analysis retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwitterSentimentResponse'
        '404':
          description: Stock symbol not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/social/twitter/trending:
    get:
      tags:
        - Social Media
      summary: Get trending stocks on Twitter
      description: Get stocks that are trending on Twitter
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of trending stocks to return
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - name: timeframe
          in: query
          required: false
          description: Timeframe for trending calculation
          schema:
            type: string
            enum: [1h, 4h, 24h, 7d]
            default: "24h"
      responses:
        '200':
          description: Trending stocks retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwitterTrendingResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/social/twitter/health:
    get:
      tags:
        - Social Media
      summary: Check Twitter API health
      description: Check Twitter API health and configuration status
      security: []
      responses:
        '200':
          description: Twitter API health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwitterHealthResponse'
        '503':
          description: Twitter API unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from the login endpoint

  schemas:
    # Base Response Schemas
    SuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Operation completed successfully
        timestamp:
          type: string
          format: date-time
          example: "2025-01-09T10:30:00Z"
        request_id:
          type: string
          example: "req_123456789"
      required:
        - status
        - message
        - timestamp

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: An error occurred
        error_code:
          type: string
          example: "GENERIC_ERROR"
        timestamp:
          type: string
          format: date-time
          example: "2025-01-09T10:30:00Z"
        request_id:
          type: string
          example: "req_123456789"
      required:
        - status
        - message
        - error_code
        - timestamp

    ValidationErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Validation failed
        error_code:
          type: string
          example: "VALIDATION_ERROR"
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
        timestamp:
          type: string
          format: date-time
          example: "2025-01-09T10:30:00Z"
        request_id:
          type: string
          example: "req_123456789"
      required:
        - status
        - message
        - error_code
        - timestamp

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object
          properties:
            service:
              type: string
              example: "QuantumVestAI API"
            version:
              type: string
              example: "1.0.0"
            environment:
              type: string
              example: "production"
            uptime:
              type: number
              example: 86400
            database:
              type: object
              properties:
                status:
                  type: string
                  example: "healthy"
                connection_pool:
                  type: integer
                  example: 10
            external_services:
              type: object
              properties:
                twitter_api:
                  type: string
                  example: "healthy"
                stock_data_api:
                  type: string
                  example: "healthy"
        timestamp:
          type: string
          format: date-time
          example: "2025-01-09T10:30:00Z"

    # Authentication Schemas
    LoginResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object
          properties:
            access_token:
              type: string
              example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
            token_type:
              type: string
              example: "bearer"
            expires_in:
              type: integer
              example: 3600
            user:
              $ref: '#/components/schemas/User'
        message:
          type: string
          example: "Login successful"
        timestamp:
          type: string
          format: date-time
          example: "2025-01-09T10:30:00Z"

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        token_type:
          type: string
          example: "bearer"
        expires_in:
          type: integer
          example: 3600
      required:
        - access_token
        - token_type
        - expires_in

    TokenValidResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object
          properties:
            valid:
              type: boolean
              example: true
            expires_at:
              type: string
              format: date-time
              example: "2025-01-09T11:30:00Z"
            user:
              $ref: '#/components/schemas/User'
        message:
          type: string
          example: "Token is valid"
        timestamp:
          type: string
          format: date-time
          example: "2025-01-09T10:30:00Z"

    RegisterRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[A-Za-z0-9_]+$'
          description: Username (alphanumeric and underscore only)
          example: "john_doe"
        email:
          type: string
          format: email
          description: Email address
          example: "john.doe@example.com"
        password:
          type: string
          format: password
          minLength: 8
          description: Password (minimum 8 characters)
          example: "SecurePass123!"
        full_name:
          type: string
          description: Full name (optional)
          example: "John Doe"
      required:
        - username
        - email
        - password

    RegisterResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
        message:
          type: string
          example: "User registered successfully"
        timestamp:
          type: string
          format: date-time
          example: "2025-01-09T10:30:00Z"

    # User Management Schemas
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: "john_doe"
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        full_name:
          type: string
          example: "John Doe"
        role:
          type: string
          enum: [user, admin, premium]
          example: "user"
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: "2025-01-09T10:30:00Z"
        last_login:
          type: string
          format: date-time
          example: "2025-01-09T10:30:00Z"
        api_key:
          type: string
          example: "qv_1234567890abcdef"
      required:
        - id
        - username
        - email
        - role
        - is_active
        - created_at

    UserResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/User'
        timestamp:
          type: string
          format: date-time
          example: "2025-01-09T10:30:00Z"

    UserUpdateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Email address
          example: "john.doe@example.com"
        full_name:
          type: string
          description: Full name
          example: "John Doe"

    UsersListResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object
          properties:
            users:
              type: array
              items:
                $ref: '#/components/schemas/User'
            pagination:
              type: object
              properties:
                page:
                  type: integer
                  example: 1
                limit:
                  type: integer
                  example: 10
                total:
                  type: integer
                  example: 100
                total_pages:
                  type: integer
                  example: 10
        timestamp:
          type: string
          format: date-time
          example: "2025-01-09T10:30:00Z"

    ApiKeyResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object
          properties:
            api_key:
              type: string
              example: "qv_1234567890abcdef"
            created_at:
              type: string
              format: date-time
              example: "2025-01-09T10:30:00Z"
            expires_at:
              type: string
              format: date-time
              example: "2025-01-10T10:30:00Z"
        message:
          type: string
          example: "API key regenerated successfully"
        timestamp:
          type: string
          format: date-time
          example: "2025-01-09T10:30:00Z"

    # Stock Schemas
    Stock:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        symbol:
          type: string
          example: "AAPL"
        name:
          type: string
          example: "Apple Inc."
        exchange:
          type: string
          example: "NASDAQ"
        sector:
          type: string
          example: "Technology"
        industry:
          type: string
          example: "Consumer Electronics"
        market_cap:
          type: number
          format: float
          example: 3000000000000
        current_price:
          type: number
          format: float
          example: 150.25
        price_change:
          type: number
          format: float
          example: 2.15
        price_change_percent:
          type: number
          format: float
          example: 1.45
        volume:
          type: number
          format: int64
          example: 85000000
        high_24h:
          type: number
          format: float
          example: 152.50
        low_24h:
          type: number
          format: float
          example: 148.75
        open_price:
          type: number
          format: float
          example: 149.00
        previous_close:
          type: number
          format: float
          example: 148.10
        last_updated:
          type: string
          format: date-time
          example: "2025-01-09T10:30:00Z"
