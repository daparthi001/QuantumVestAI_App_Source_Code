openapi: 3.0.3
info:
  title: QuantumVestAI API
  description: |
    **QuantumVestAI** is a comprehensive stock market analysis platform that provides AI-powered forecasting, sentiment analysis, and portfolio management capabilities.
    
    ## Features
    - **AI-Powered Stock Forecasting**: Advanced machine learning models for stock price predictions
    - **Real-Time Sentiment Analysis**: Twitter sentiment analysis for stock symbols
    - **Portfolio Management**: Complete portfolio tracking and management
    - **User Management**: Role-based access control and user authentication
    - **Administrative Tools**: System monitoring and administrative functions
    
    ## Authentication
    This API uses JWT Bearer token authentication. To authenticate:
    1. Use the `/api/v1/auth/login` endpoint with your credentials
    2. Include the returned token in the Authorization header: `Authorization: Bearer <token>`
    
    ## Rate Limiting
    API requests are rate-limited to prevent abuse:
    - Standard users: 100 requests per minute
    - Premium users: 1000 requests per minute
    - Admin users: Unlimited
    
    ## Base URL
    - **Development**: `https://dev.quantumvestai.com`
    - **Production**: `https://api.quantumvestai.com`
    
  version: 1.0.0
  contact:
    name: QuantumVestAI Support
    email: support@quantumvestai.com
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://dev.quantumvestai.com
    description: Development server
  - url: https://api.quantumvestai.com
    description: Production server
  - url: http://quantumvestai-dev-api:8000
    description: Internal cluster service

security:
  - bearerAuth: []

paths:
  # Health Check
  /api/v1/health:
    get:
      tags:
        - Health
      summary: Health check endpoint
      description: Check the health and status of the API service
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Authentication APIs
  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user and get access token
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: User's username
                password:
                  type: string
                  format: password
                  description: User's password
              required:
                - username
                - password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: Register new user
      description: Register a new user account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Invalid input or user already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /api/v1/auth/token:
    post:
      tags:
        - Authentication
      summary: Get access token
      description: Get access token with username/password (alternative to login)
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
              required:
                - username
                - password
      responses:
        '200':
          description: Token generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/verify:
    post:
      tags:
        - Authentication
      summary: Verify JWT token
      description: Verify the validity of a JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: JWT token to verify
              required:
                - token
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenValidResponse'
        '401':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      description: Logout user and invalidate token
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/password/change:
    post:
      tags:
        - Authentication
      summary: Change user password
      description: Change the current user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                  format: password
                  description: Current password
                new_password:
                  type: string
                  format: password
                  description: New password
                  minLength: 8
              required:
                - current_password
                - new_password
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid current password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/password/reset/request:
    post:
      tags:
        - Authentication
      summary: Request password reset
      description: Request a password reset for a user account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Email address of the user
              required:
                - email
      responses:
        '200':
          description: Password reset email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/password/reset/verify:
    post:
      tags:
        - Authentication
      summary: Verify password reset token
      description: Verify the validity of a password reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: Password reset token
              required:
                - token
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenValidResponse'
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/password/reset/complete:
    post:
      tags:
        - Authentication
      summary: Complete password reset
      description: Complete the password reset process with a new password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: Password reset token
                new_password:
                  type: string
                  format: password
                  description: New password
                  minLength: 8
              required:
                - token
                - new_password
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # User Management APIs
  /api/v1/users/me:
    get:
      tags:
        - User Management
      summary: Get current user info
      description: Get information about the currently authenticated user
      responses:
        '200':
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - User Management
      summary: Update current user info
      description: Update information for the currently authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: User information updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/{user_id}:
    get:
      tags:
        - User Management
      summary: Get user by ID
      description: Get information about a specific user by their ID
      parameters:
        - name: user_id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users:
    get:
      tags:
        - User Management
      summary: List all users
      description: Get a list of all users (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: Page number for pagination
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Number of items per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: role
          in: query
          required: false
          description: Filter users by role
          schema:
            type: string
            enum: [user, admin, premium]
        - name: active
          in: query
          required: false
          description: Filter users by active status
          schema:
            type: boolean
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/{user_id}/role:
    put:
      tags:
        - User Management
      summary: Update user role
      description: Update the role of a specific user (admin only)
      parameters:
        - name: user_id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [user, admin, premium]
                  description: New role for the user
              required:
                - role
      responses:
        '200':
          description: User role updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/{user_id}/status:
    put:
      tags:
        - User Management
      summary: Update user status
      description: Update the active status of a specific user (admin only)
      parameters:
        - name: user_id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_active:
                  type: boolean
                  description: Active status for the user
              required:
                - is_active
      responses:
        '200':
          description: User status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/username/{username}:
    get:
      tags:
        - User Management
      summary: Get user by username
      description: Get information about a specific user by their username
      parameters:
        - name: username
          in: path
          required: true
          description: Username
          schema:
            type: string
      responses:
        '200':
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/regenerate-api-key:
    post:
      tags:
        - User Management
      summary: Regenerate API key
      description: Regenerate the API key for the current user
      responses:
        '200':
          description: API key regenerated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Stock APIs
  /api/v1/stocks/search:
    get:
      tags:
        - Stocks
      summary: Search for stocks
      description: Search for stocks by symbol or company name
      parameters:
        - name: query
          in: query
          required: true
          description: Search query (symbol or company name)
          schema:
            type: string
            minLength: 1
            example: "AAPL"
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: exchange
          in: query
          required: false
          description: Filter by exchange
          schema:
            type: string
            enum: [NYSE, NASDAQ, AMEX]
      responses:
        '200':
          description: Stock search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockSearchResponse'
        '400':
          description: Invalid search query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/stocks/{ticker}:
    get:
      tags:
        - Stocks
      summary: Get stock info
      description: Get detailed information about a specific stock
      parameters:
        - name: ticker
          in: path
          required: true
          description: Stock ticker symbol
          schema:
            type: string
            pattern: '^[A-Z]{1,5}$'
            example: "AAPL"
      responses:
        '200':
          description: Stock information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockDetailResponse'
        '404':
          description: Stock not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/stocks/{ticker}/history:
    get:
      tags:
        - Stocks
      summary: Get stock price history
      description: Get historical price data for a stock
      parameters:
        - name: ticker
          in: path
          required: true
          description: Stock ticker symbol
          schema:
            type: string
            pattern: '^[A-Z]{1,5}$'
            example: "AAPL"
        - name: period
          in: query
          required: false
          description: Time period for historical data
          schema:
            type: string
            enum: [1d, 5d, 1mo, 3mo, 6mo, 1y, 2y, 5y, 10y, ytd, max]
            default: "1y"
        - name: interval
          in: query
          required: false
          description: Data interval
          schema:
            type: string
            enum: [1m, 2m, 5m, 15m, 30m, 60m, 90m, 1h, 1d, 5d, 1wk, 1mo, 3mo]
            default: "1d"
        - name: start_date
          in: query
          required: false
          description: Start date for historical data (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2024-01-01"
        - name: end_date
          in: query
          required: false
          description: End date for historical data (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2024-12-31"
      responses:
        '200':
          description: Stock price history retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockHistoryResponse'
        '404':
          description: Stock not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/stocks/trending:
    get:
      tags:
        - Stocks
      summary: Get trending stocks
      description: Get a list of currently trending stocks
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: timeframe
          in: query
          required: false
          description: Timeframe for trending calculation
          schema:
            type: string
            enum: [1h, 4h, 24h, 7d]
            default: "24h"
      responses:
        '200':
          description: Trending stocks retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendingStocksResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/stocks/most-predictable:
    get:
      tags:
        - Stocks
      summary: Get most predictable stocks
      description: Get stocks with highest predictability scores
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: min_score
          in: query
          required: false
          description: Minimum predictability score
          schema:
            type: number
            minimum: 0.0
            maximum: 1.0
            default: 0.7
      responses:
        '200':
          description: Most predictable stocks retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictableStocksResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/stocks/sector/{sector}:
    get:
      tags:
        - Stocks
      summary: Get stocks by sector
      description: Get stocks filtered by sector
      parameters:
        - name: sector
          in: path
          required: true
          description: Sector name
          schema:
            type: string
            enum: [Technology, Healthcare, Financial, Consumer, Energy, Industrials, Materials, Utilities, Real Estate, Telecommunications]
            example: "Technology"
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort_by
          in: query
          required: false
          description: Sort criteria
          schema:
            type: string
            enum: [market_cap, volume, price_change, name]
            default: "market_cap"
      responses:
        '200':
          description: Stocks by sector retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StocksBySectorResponse'
        '404':
          description: Sector not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/stocks/industry/{industry}:
    get:
      tags:
        - Stocks
      summary: Get stocks by industry
      description: Get stocks filtered by industry
      parameters:
        - name: industry
          in: path
          required: true
          description: Industry name
          schema:
            type: string
            example: "Software"
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort_by
          in: query
          required: false
          description: Sort criteria
          schema:
            type: string
            enum: [market_cap, volume, price_change, name]
            default: "market_cap"
      responses:
        '200':
          description: Stocks by industry retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StocksByIndustryResponse'
        '404':
          description: Industry not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/stocks/markets/summary:
    get:
      tags:
        - Stocks
      summary: Get market summary
      description: Get overall market summary and key indicators
      responses:
        '200':
          description: Market summary retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketSummaryResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Forecast APIs
  /api/v1/forecast/{ticker}:
    get:
      tags:
        - Forecasts
      summary: Get stock forecast
      description: Get AI-powered forecast for a specific stock
      parameters:
        - name: ticker
          in: path
          required: true
          description: Stock ticker symbol
          schema:
            type: string
            pattern: '^[A-Z]{1,5}$'
            example: "AAPL"
        - name: horizon
          in: query
          required: false
          description: Forecast horizon in days
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
        - name: model
          in: query
          required: false
          description: Forecast model to use
          schema:
            type: string
            enum: [lstm, transformer, ensemble, arima]
            default: "ensemble"
        - name: confidence_interval
          in: query
          required: false
          description: Confidence interval for predictions
          schema:
            type: number
            minimum: 0.8
            maximum: 0.99
            default: 0.95
      responses:
