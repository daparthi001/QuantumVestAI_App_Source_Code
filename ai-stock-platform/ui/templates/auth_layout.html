<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}QuantumVestAI{% endblock %}</title>
    
    <!-- Bootstrap CSS from CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons from CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    
    <!-- Inline Auth CSS - Fixed Mixed Content Issue -->
    <style>
    /* QuantumVestAI Authentication Styles
       Updated: 2025-06-17 20:10:39
       Author: daparthi001
    */
    
    /* Auth page container */
    .auth-page {
        background-color: #f8f9fa;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    
    /* Auth card container */
    .auth-container {
        width: 100%;
        max-width: 420px;
        margin: 0 auto;
    }
    
    .auth-card {
        background-color: #fff;
        border-radius: 10px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        padding: 2rem;
    }
    
    /* Logo and header */
    .auth-header {
        text-align: center;
        margin-bottom: 2rem;
    }
    
    .auth-logo {
        display: inline-block;
        margin-bottom: 1rem;
    }
    
    .auth-logo img {
        height: 50px;
    }
    
    .auth-title {
        font-size: 1.8rem;
        margin-bottom: 0.5rem;
        font-weight: 600;
    }
    
    .auth-subtitle {
        color: #6c757d;
        margin-bottom: 0;
    }
    
    /* Form body */
    .auth-body {
        margin-bottom: 2rem;
    }
    
    /* Password input with toggle */
    .password-input {
        position: relative;
    }
    
    .password-toggle {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: transparent;
        color: #6c757d;
        padding: 0;
        cursor: pointer;
    }
    
    /* Password strength meter */
    .password-strength .progress {
        height: 8px;
    }
    
    .password-strength .progress-bar {
        transition: width 0.3s ease;
    }
    
    /* Auth footer */
    .auth-footer {
        text-align: center;
    }
    
    /* Modified button states */
    .btn-primary {
        background-color: #4361ee;
        border-color: #4361ee;
    }
    
    .btn-primary:hover, .btn-primary:focus {
        background-color: #3a56d4;
        border-color: #3a56d4;
    }
    
    .btn-primary:disabled {
        background-color: #3a56d4;
        border-color: #3a56d4;
    }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body class="auth-page">
    {% block content %}{% endblock %}
    
    <!-- Bootstrap JS Bundle with Popper from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
