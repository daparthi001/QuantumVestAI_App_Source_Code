{% extends "auth_layout.html" %}

{% block title %}Login - QuantumVestAI{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <a href="/" class="auth-logo">
                <img src="{{ url_for('static', path='/img/logo.svg') }}" alt="QuantumVestAI">
            </a>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Sign in to continue to QuantumVestAI</p>
        </div>
        
        {% if msg %}
        <div class="alert alert-{% if 'success' in msg %}success{% else %}danger{% endif %} alert-dismissible fade show" role="alert">
            {{ msg }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endif %}
        
        <div class="auth-body">
            <form method="post" action="/login" id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required autofocus>
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="password-input">
                        <input type="password" class="form-control" id="password" name="password" required>
                        <button type="button" class="password-toggle" tabindex="-1">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="mb-3 d-flex justify-content-between align-items-center">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember">
                        <label class="form-check-label" for="remember">Remember me</label>
                    </div>
                    <a href="/forgot-password" class="text-reset small">Forgot Password?</a>
                </div>
                
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary" id="loginBtn">Sign In</button>
                </div>
            </form>
        </div>
        
        <div class="auth-footer">
            <p class="text-center">Don't have an account? <a href="/register">Sign up</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
/**
 * Enhanced Login Form JavaScript - Fixed URLs
 * Date: 2025-06-17 19:42:11
 * Author: daparthi001
 */
document.addEventListener('DOMContentLoaded', function() {
    // Password visibility toggle
    const toggleButton = document.querySelector('.password-toggle');
    
    if (toggleButton) {
        toggleButton.addEventListener('click', function() {
            const input = this.parentNode.querySelector('input');
            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);
            
            // Toggle icon
            const icon = this.querySelector('i');
            icon.classList.toggle('bi-eye');
            icon.classList.toggle('bi-eye-slash');
        });
    }

    // Emergency login function - FIXED URL
    async function emergencyLogin(username, password) {
        try {
            console.log('Attempting emergency login for:', username);
            
            // FIXED: Use direct URL without /auth prefix
            const response = await fetch('/emergency-login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            });
            
            console.log('Emergency login response status:', response.status);
            const data = await response.json();
            console.log('Emergency login response:', data);
            
            if (data.success) {
                // Store the token
                localStorage.setItem('auth_token', data.access_token);
                
                // Redirect to dashboard
                window.location.href = data.redirect_url || '/dashboard';
                return true;
            }
            return false;
        } catch (error) {
            console.error('Emergency login error:', error);
            return false;
        }
    }

    // Handle login form submission
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    
    if (loginForm) {
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            
            // Basic validation
            if (!username || !password) {
                showAlert('Please enter both username and password', 'danger');
                return;
            }
            
            // Show loading state
            if (loginBtn) {
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Signing in...';
            }
            
            try {
                // FIXED: Use direct URL without /auth prefix
                console.log('Sending login request to /login');
                
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);
                formData.append('remember', remember);
                
                const response = await fetch('/login', {
                    method: 'POST',
                    body: formData
                });
                
                console.log('Login response status:', response.status);
                
                // Handle redirect
                if (response.redirected) {
                    console.log('Redirecting to:', response.url);
                    window.location.href = response.url;
                    return;
                }
                
                // Handle JSON response
                if (response.headers.get('content-type')?.includes('application/json')) {
                    const responseText = await response.text();
                    console.log('Login response text:', responseText);
                    
                    let data;
                    try {
                        data = JSON.parse(responseText);
                        console.log('Login response data:', data);
                    } catch (parseErr) {
                        console.error('Error parsing JSON response:', parseErr);
                        data = { success: response.ok };
                    }
                    
                    if (response.ok) {
                        // Store token in localStorage if available
                        if (data.access_token) {
                            localStorage.setItem('auth_token', data.access_token);
                        }
                        
                        // Redirect to dashboard or specified next URL
                        const urlParams = new URLSearchParams(window.location.search);
                        const nextUrl = urlParams.get('next') || '/dashboard';
                        window.location.href = nextUrl;
                    } else {
                        // Try emergency login as a fallback
                        if (loginBtn) {
                            loginBtn.innerHTML = 'Trying alternative login...';
                        }
                        
                        // Try emergency login as a backup
                        const emergencyResult = await emergencyLogin(username, password);
                        if (emergencyResult) {
                            return; // Successfully logged in with emergency method
                        }
                        
                        showAlert(data.detail || 'Login failed. Please check your credentials.', 'danger');
                        resetLoginButton();
                    }
                } else {
                    // For non-JSON responses (like HTML)
                    if (!response.ok) {
                        // Try emergency login as a fallback
                        if (loginBtn) {
                            loginBtn.innerHTML = 'Trying alternative login...';
                        }
                        
                        // Try emergency login as a backup
                        const emergencyResult = await emergencyLogin(username, password);
                        if (emergencyResult) {
                            return; // Successfully logged in with emergency method
                        }
                        
                        showAlert('Login failed. Please check your credentials.', 'danger');
                        resetLoginButton();
                    }
                }
            } catch (error) {
                console.error('Login error:', error);
                
                // Try emergency login as a last resort
                if (loginBtn) {
                    loginBtn.innerHTML = 'Trying emergency login...';
                }
                
                // Try emergency login as a backup
                const emergencyResult = await emergencyLogin(username, password);
                if (emergencyResult) {
                    return; // Successfully logged in with emergency method
                }
                
                showAlert('An error occurred during login. Please try again.', 'danger');
                resetLoginButton();
            }
        });
    }
    
    function showAlert(message, type = 'danger') {
        // Remove any existing alerts
        const existingAlerts = document.querySelectorAll('.alert');
        existingAlerts.forEach(alert => alert.remove());
        
        // Create new alert
        const alertDiv = document.createElement('div');
        alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
        alertDiv.role = 'alert';
        alertDiv.innerHTML = message;
        
        const closeButton = document.createElement('button');
        closeButton.type = 'button';
        closeButton.className = 'btn-close';
        closeButton.setAttribute('data-bs-dismiss', 'alert');
        closeButton.setAttribute('aria-label', 'Close');
        
        alertDiv.appendChild(closeButton);
        
        // Insert before the form
        const authHeader = document.querySelector('.auth-header');
        authHeader.parentNode.insertBefore(alertDiv, authHeader.nextSibling);
    }
    
    function resetLoginButton() {
        if (loginBtn) {
            loginBtn.disabled = false;
            loginBtn.innerHTML = 'Sign In';
        }
    }
    
    // Check for registration success
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('registered') === 'true') {
        showAlert('Registration successful! Please sign in with your new account.', 'success');
    }
});
</script>
{% endblock %}
