{% extends "auth_layout.html" %}

{% block title %}Login - QuantumVestAI{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <a href="/" class="auth-logo">
                <img src="{{ url_for('static', path='/img/logo.svg') }}" alt="QuantumVestAI">
            </a>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Sign in to continue to QuantumVestAI</p>
        </div>
        
        {% if msg %}
        <div class="alert alert-{% if 'success' in msg %}success{% else %}danger{% endif %} alert-dismissible fade show" role="alert">
            {{ msg }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endif %}
        
        <div class="auth-body">
            <form method="post" action="/auth/login" id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required autofocus>
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="password-input">
                        <input type="password" class="form-control" id="password" name="password" required>
                        <button type="button" class="password-toggle" tabindex="-1">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="mb-3 d-flex justify-content-between align-items-center">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember">
                        <label class="form-check-label" for="remember">Remember me</label>
                    </div>
                    <a href="/forgot-password" class="text-reset small">Forgot Password?</a>
                </div>
                
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Sign In</button>
                </div>
            </form>
        </div>
        
        <div class="auth-footer">
            <p class="text-center">Don't have an account? <a href="/register">Sign up</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Password visibility toggle
        const toggleButton = document.querySelector('.password-toggle');
        
        if (toggleButton) {
            toggleButton.addEventListener('click', function() {
                const input = this.parentNode.querySelector('input');
                const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                input.setAttribute('type', type);
                
                // Toggle icon
                const icon = this.querySelector('i');
                icon.classList.toggle('bi-eye');
                icon.classList.toggle('bi-eye-slash');
            });
        }

        // Handle login form submission with fetch API
        const loginForm = document.getElementById('loginForm');
        if (loginForm) {
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const remember = document.getElementById('remember').checked;
                
                try {
                    // Show loading indicator if available
                    const submitButton = this.querySelector('button[type="submit"]');
                    if (submitButton) {
                        submitButton.disabled = true;
                        submitButton.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Signing in...';
                    }
                    
                    const formData = new FormData();
                    formData.append('username', username);
                    formData.append('password', password);
                    formData.append('remember', remember);
                    
                    const response = await fetch('/auth/login', {
                        method: 'POST',
                        body: formData
                    });
                    
                    if (response.redirected) {
                        window.location.href = response.url;
                        return;
                    }
                    
                    if (response.ok) {
                        const data = await response.json();
                        
                        // Store token in localStorage
                        if (data.access_token) {
                            localStorage.setItem('auth_token', data.access_token);
                        }
                        
                        // Redirect to dashboard or next parameter
                        const urlParams = new URLSearchParams(window.location.search);
                        const nextUrl = urlParams.get('next') || '/dashboard';
                        window.location.href = nextUrl;
                    } else {
                        const errorData = await response.json();
                        // Show error message
                        const alertDiv = document.createElement('div');
                        alertDiv.className = 'alert alert-danger alert-dismissible fade show';
                        alertDiv.role = 'alert';
                        alertDiv.innerHTML = errorData.detail || 'Login failed. Please check your credentials.';
                        
                        const closeButton = document.createElement('button');
                        closeButton.type = 'button';
                        closeButton.className = 'btn-close';
                        closeButton.setAttribute('data-bs-dismiss', 'alert');
                        closeButton.setAttribute('aria-label', 'Close');
                        
                        alertDiv.appendChild(closeButton);
                        
                        const authHeader = document.querySelector('.auth-header');
                        authHeader.insertAdjacentElement('afterend', alertDiv);
                        
                        // Re-enable button
                        if (submitButton) {
                            submitButton.disabled = false;
                            submitButton.innerHTML = 'Sign In';
                        }
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    
                    // Show error message
                    const alertDiv = document.createElement('div');
                    alertDiv.className = 'alert alert-danger alert-dismissible fade show';
                    alertDiv.role = 'alert';
                    alertDiv.innerHTML = 'An error occurred during login. Please try again.';
                    
                    const closeButton = document.createElement('button');
                    closeButton.type = 'button';
                    closeButton.className = 'btn-close';
                    closeButton.setAttribute('data-bs-dismiss', 'alert');
                    closeButton.setAttribute('aria-label', 'Close');
                    
                    alertDiv.appendChild(closeButton);
                    
                    const authHeader = document.querySelector('.auth-header');
                    authHeader.insertAdjacentElement('afterend', alertDiv);
                    
                    // Re-enable button
                    const submitButton = this.querySelector('button[type="submit"]');
                    if (submitButton) {
                        submitButton.disabled = false;
                        submitButton.innerHTML = 'Sign In';
                    }
                }
            });
        }
    });
</script>
{% endblock %}
