{% extends "auth_layout.html" %}

{% block title %}Reset Password - QuantumVestAI{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <a href="/" class="auth-logo">
                <img src="{{ get_asset_url('img/logo.svg') }}" alt="QuantumVestAI" onerror="this.src='{{ get_asset_url('img/logo-placeholder.png') }}'">

            </a>
            <h1 class="auth-title">Reset Password</h1>
            <p class="auth-subtitle">Enter your email to receive reset instructions</p>
        </div>
        
        {% if msg %}
        <div class="alert alert-{% if msg_type == 'success' %}success{% else %}danger{% endif %} alert-dismissible fade show" role="alert">
            {{ msg }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endif %}
        
        <div class="auth-body">
            <form method="post" action="/password-reset">
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" name="email" required autofocus>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Send Reset Instructions</button>
                </div>
            </form>
        </div>
        
        <div class="auth-footer">
            <p class="text-center">Remember your password? <a href="/auth/login">Back to login</a></p>
        </div>
    </div>
</div>
{% endblock %}
