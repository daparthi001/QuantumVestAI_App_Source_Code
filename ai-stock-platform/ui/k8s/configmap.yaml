apiVersion: v1
kind: ConfigMap
metadata:
  name: quantumvestai-ui-config
  namespace: quantumvestai
data:
  ENV: "production"
  DEBUG: "false"
  PORT: "8000"
  HOST: "0.0.0.0"
  WORKERS: "4"
  LOG_LEVEL: "info"
  API_BASE_URL: "http://quantumvestai-api-service:5000/api"
  CACHE_TYPE: "RedisCache"
  CACHE_DEFAULT_TIMEOUT: "300"
  REDIS_URL: "redis://quantumvestai-redis-service:6379/0"
  CORS_ORIGINS: "https://quantumvestai.com,https://www.quantumvestai.com,https://api.quantumvestai.com"
  CORS_ALLOW_CREDENTIALS: "true"
  SESSION_COOKIE_NAME: "quantumvest_session"
  SESSION_COOKIE_SECURE: "true"
  SESSION_COOKIE_HTTPONLY: "true"
  SESSION_COOKIE_SAMESITE: "strict"