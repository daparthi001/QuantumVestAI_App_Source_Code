apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantumvestai-ui
  namespace: quantumvestai
  labels:
    app: quantumvestai-ui
spec:
  replicas: 3
  selector:
    matchLabels:
      app: quantumvestai-ui
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: quantumvestai-ui
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: quantumvestai-ui-sa
      containers:
      - name: quantumvestai-ui
        image: ${DOCKER_REGISTRY}/quantumvestai-ui:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        envFrom:
        - configMapRef:
            name: quantumvestai-ui-config
        - secretRef:
            name: quantumvestai-ui-secrets
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        volumeMounts:
        - name: logs-volume
          mountPath: /app/logs
      volumes:
      - name: logs-volume
        emptyDir: {}
      # In production, you might want to use a persistent volume for logs instead
      # - name: logs-volume
      #   persistentVolumeClaim:
      #     claimName: quantumvestai-logs-pvc