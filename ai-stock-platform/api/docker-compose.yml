version: '3.8'

services:
  db:
    image: postgres:13
    container_name: quantumvest_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=quantumvest
      - POSTGRES_PASSWORD=localdev
      - POSTGRES_DB=quantumvestai
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantumvest"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quantumvest_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db-init:
    build:
      context: .
      dockerfile: Dockerfile.db-init
    container_name: quantumvest_db_init
    environment:
      - DB_HOST=db
      - DB_USER=quantumvest
      - DB_PASSWORD=${DB_PASSWORD:-localdev}
      - DB_NAME=quantumvestai
      - DB_PORT=5432
    networks:
      - quantumvest_network
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        - BUILD_DATE=2025-05-20
        - VERSION=1.0.0
    container_name: quantumvest_api
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_USER=quantumvest
      - DB_PASSWORD=localdev
      - DB_NAME=quantumvestai
      - DB_PORT=5432
      - USE_IAM_AUTH=false
      - ENVIRONMENT=development
      - DEBUG=true
    volumes:
      - ./api:/app/api
      - api_logs:/app/logs
    networks:
      - quantumvest_network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
    name: quantumvest_postgres_data
  api_logs:
    name: quantumvest_api_logs

networks:
  quantumvest_network:
    name: quantumvest_network
    driver: bridge