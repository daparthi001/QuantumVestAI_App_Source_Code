[tool.poetry]
name = "quantumvestai-api"
version = "1.0.0"
description = "Stock market forecasting and analytics API using quantum machine learning models"
authors = ["QuantumVestAI Team <team@quantumvestai.com>"]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.103.1"
uvicorn = {extras = ["standard"], version = "^0.23.2"}
sqlalchemy = "^2.0.20"
alembic = "^1.12.0"
pydantic = "^2.4.2"
pydantic-settings = "^2.0.3"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.6"
python-dotenv = "^1.0.0"
psycopg2-binary = "^2.9.7"
email-validator = "^2.0.0"
redis = "^5.0.0"
pandas = "^2.1.0"
numpy = "^1.25.2"
scipy = "^1.11.2"
scikit-learn = "^1.3.0"
prophet = "^1.1.4"
xgboost = "^1.7.6"
tensorflow = "^2.13.0"
statsmodels = "^0.14.0"

[tool.poetry.dev-dependencies]
pytest = "^7.4.2"
pytest-cov = "^4.1.0"
black = "^23.7.0"
isort = "^5.12.0"
flake8 = "^6.1.0"
mypy = "^1.5.1"
pre-commit = "^3.4.0"

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"