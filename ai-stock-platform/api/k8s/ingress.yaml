apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quantumvestai-api-ingress
  namespace: quantumvestai
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:region:account-id:certificate/certificate-id  # Update this
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
    alb.ingress.kubernetes.io/success-codes: '200'
    alb.ingress.kubernetes.io/group.name: "api-group"
spec:
  rules:
  - host: api.quantumvestai.com  # Update this with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: quantumvestai-api
            port:
              number: 80
  tls:
  - hosts:
    - api.quantumvestai.com  # Update this with your domain