apiVersion: batch/v1
kind: Job
metadata:
  name: db-init-job
  namespace: quantumvestai
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400  # Delete job after 1 day
  template:
    spec:
      serviceAccountName: quantumvestai-api-sa  # Service account with RDS access
      restartPolicy: Never
      containers:
      - name: db-init
        image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/quantumvestai-db-init:${IMAGE_TAG}
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        envFrom:
        - configMapRef:
            name: api-config
        - secretRef:
            name: api-secrets
        env:
        - name: ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: ADMIN_USERNAME
              optional: true
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: ADMIN_PASSWORD
              optional: true
        - name: ADMIN_EMAIL
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: ADMIN_EMAIL
              optional: true