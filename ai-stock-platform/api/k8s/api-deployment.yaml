Created: 2025-05-19 05:41:48
Author: daparthi001
"""
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantumvest-api
  namespace: quantumvest
spec:
  replicas: 3
  selector:
    matchLabels:
      app: quantumvest-api
  template:
    metadata:
      labels:
        app: quantumvest-api
    spec:
      containers:
      - name: api
        image: quantumvest/api:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: api-config
        volumeMounts:
        - name: db-secrets
          mountPath: "/etc/secrets/db"
          readOnly: true
        - name: api-secrets
          mountPath: "/etc/secrets/api"
          readOnly: true
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: db-secrets
        secret:
          secretName: db-secrets
      - name: api-secrets
        secret:
          secretName: api-secrets