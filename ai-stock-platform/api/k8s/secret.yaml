apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: quantumvestai
type: Opaque
data:
  # Base64 encoded secrets - DO NOT commit real values to source control!
  # Generate with: echo -n "your-secret" | base64
  JWT_SECRET: base64encoded-jwt-secret
  POSTGRES_USER: base64encoded-db-user
  POSTGRES_PASSWORD: base64encoded-db-password
  # If using API keys for external services:
  ALPHA_VANTAGE_API_KEY: base64encoded-api-key