  #     - postgres_data:/var/lib/postgresql/data/
  #   environment:
  #     - POSTGRES_USER=postgres
  #     - POSTGRES_PASSWORD=postgres
  #     - POSTGRES_DB=quantumvestai
  #   restart: unless-stopped

# Optional: Define volumes if using database
# volumes:
