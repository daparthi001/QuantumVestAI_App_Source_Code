<!DOCTYPE html>
<html>
<head>
  <title>QuantumVestAI - Login</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    
    .login-container {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      padding: 30px;
      width: 350px;
    }
    
    h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 30px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
    }
    
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 16px;
    }
    
    button {
      width: 100%;
      padding: 12px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    
    button:hover {
      background-color: #2980b9;
    }
    
    .error-message {
      color: #e74c3c;
      margin-top: 20px;
      text-align: center;
    }
    
    .links {
      margin-top: 20px;
      text-align: center;
    }
    
    .links a {
      color: #3498db;
      text-decoration: none;
    }
    
    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Login to QuantumVestAI</h2>
    
    <form method="post">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" required>
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>
      </div>
      
      <button type="submit">Login</button>
    </form>
    
    {% if msg %}
    <div class="error-message">
      {{ msg }}
    </div>
    {% endif %}
    
    <div class="links">
      <p>Don't have an account? <a href="/register">Create Account</a></p>
      <p><a href="/">Back to Home</a></p>
    </div>
  </div>
</body>
</html>
