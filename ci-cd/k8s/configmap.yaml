apiVersion: v1
kind: ConfigMap
metadata:
  name: quantumvestai-config
data:
  app-settings.json: |
    {
      "app": {
        "name": "QuantumVestAI",
        "version": "1.0.0",
        "environment": "production"
      },
      "models": {
        "default_tickers": ["AAPL", "MSFT", "GOOG"],
        "forecast_days": 7,
        "default_model": "ensemble"
      },
      "api": {
        "rate_limit": 100,
        "timeout_seconds": 30
      },
      "logging": {
        "level": "INFO"
      }
    }