apiVersion: v1
kind: ConfigMap
metadata:
  name: quantumvestai-config
  namespace: dev
data:
  # Application configuration
  ENVIRONMENT: "dev"
  API_BASE_URL: "/api"
  LOG_LEVEL: "INFO"
  CORS_ORIGINS: "*"
  
  # PostgreSQL RDS configuration
  POSTGRES_SERVER: "quantumvestai-${ENVIRONMENT}.cluster-xyz.us-east-1.rds.amazonaws.com"
  POSTGRES_DB: "quantumvestai"
  POSTGRES_PORT: "5432"
  
  # AWS configuration
  AWS_REGION: "us-east-1"
  USE_IAM_AUTH: "true"
  
  # Database initialization settings
  AUTO_APPLY_MIGRATIONS: "true"
  SEED_SAMPLE_DATA: "false"  # Will be updated by workflow based on environment
  INIT_ADMIN_USER: "true"