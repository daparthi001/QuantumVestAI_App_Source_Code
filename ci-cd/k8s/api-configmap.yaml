apiVersion: v1
kind: ConfigMap
metadata:
  name: api-configmap
  namespace: dev
data:
  # Application configuration
  ENVIRONMENT: "dev"
  API_BASE_URL: "/api"
  LOG_LEVEL: "INFO"
  CORS_ORIGINS: "*"
  
  # AWS configuration
  AWS_REGION: "us-east-1"
  USE_IAM_AUTH: "true"
  
  # Database initialization settings
  AUTO_APPLY_MIGRATIONS: "true"
  SEED_SAMPLE_DATA: "false"
  INIT_ADMIN_USER: "true"