apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quantumvestai
  annotations:
    # Basic ALB settings
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    
    # SSL/TLS configuration
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    #alb.ingress.kubernetes.io/ssl-redirect: '443'
    #alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:<YOUR-REGION>:<YOUR-ACCOUNT-ID>:certificate/<CERTIFICATE-ID>
    
    # Security groups and subnets
    #alb.ingress.kubernetes.io/security-groups: <SECURITY-GROUP-ID>
    alb.ingress.kubernetes.io/subnets: subnet-059291c36248c77a2,subnet-02026a49b5dbee617,subnet-0289ef733cc39a302
    
    # Performance optimizations
    # alb.ingress.kubernetes.io/load-balancer-attributes: >-
    #   routing.http.drop_invalid_header_fields.enabled=true,
    #   idle_timeout.timeout_seconds=60,
    #   deletion_protection.enabled=true,
    #   access_logs.s3.enabled=true,
    #   access_logs.s3.bucket=quantumvestai-logs,
    #   access_logs.s3.prefix=alb-logs
    
    # Health check settings
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'
    
    # Session stickiness if needed for user sessions
    alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.lb_cookie.duration_seconds=86400
    
    # Additional tags for cost tracking
    alb.ingress.kubernetes.io/tags: Environment=dev,Project=QuantumVestAI
spec:
  rules:
  - host: quantumvestai.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ui-service
            port:
              number: 80