apiVersion: v1
kind: Secret
metadata:
  name: quantumvestai-secrets
type: Opaque
data:
  # Authentication
  JWT_SECRET_KEY: <base64-encoded-jwt-key>
  
  # API Keys
  YAHOO_FINANCE_API_KEY: <base64-encoded-yahoo-key>
  TWITTER_API_KEY: <base64-encoded-twitter-key>
  TWITTER_API_SECRET: <base64-encoded-twitter-secret>
  TWITTER_ACCESS_TOKEN: <base64-encoded-twitter-token>
  TWITTER_ACCESS_SECRET: <base64-encoded-twitter-access-secret>
  
  # Database
  DB_PASSWORD: <base64-encoded-db-password>