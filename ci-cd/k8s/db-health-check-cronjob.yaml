apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-health-check
  namespace: dev
spec:
  schedule: "0 */4 * * *"  # Run every 4 hours
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: quantumvestai-sa
          containers:
          - name: db-health-check
            image: 921930869047.dkr.ecr.us-east-1.amazonaws.com/quantumvestai:api-dev-latest
            command: ["/bin/sh"]
            args:
            - "-c"
            - |
              echo "Running database health check"
              python -c "from api.core.db_init import verify_database_connection; exit(0 if verify_database_connection() else 1)"
            env:
            # Database credentials from Terraform-created secret
          - name: DB_HOST
            valueFrom:
              secretKeyRef:
                name: quantumvestai-cluster-rds-credentials
                key: host
          - name: DB_PORT
            valueFrom:
              secretKeyRef:
                name: quantumvestai-cluster-rds-credentials
                key: port
          - name: DB_NAME
            valueFrom:
              secretKeyRef:
                name: quantumvestai-cluster-rds-credentials
                key: database
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: quantumvestai-cluster-rds-credentials
                key: username
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: quantumvestai-cluster-rds-credentials
                key: password
            envFrom:
            - configMapRef:
                name: api-configmap
          restartPolicy: OnFailure