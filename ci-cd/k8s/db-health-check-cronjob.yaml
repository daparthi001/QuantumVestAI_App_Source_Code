apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-health-check
  namespace: NAMESPACE_PLACEHOLDER
spec:
  schedule: "0 */4 * * *"  # Run every 4 hours
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: quantumvestai-sa
          containers:
          - name: db-health-check
            image: API_IMAGE_PLACEHOLDER
            command: ["/bin/sh"]
            args:
            - "-c"
            - |
              echo "Running database health check"
              python -c "from api.core.db_init import verify_database_connection; exit(0 if verify_database_connection() else 1)"
            env:
            # Database credentials from Terraform-created secret
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: quantumvestai-cluster-rds-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quantumvestai-cluster-rds-credentials
                  key: password
            - name: POSTGRES_SERVER
              valueFrom:
                secretKeyRef:
                  name: quantumvestai-cluster-rds-credentials
                  key: host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: quantumvestai-cluster-rds-credentials
                  key: port
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: quantumvestai-cluster-rds-credentials
                  key: dbname
            envFrom:
            - configMapRef:
                name: api-configmap
          restartPolicy: OnFailure