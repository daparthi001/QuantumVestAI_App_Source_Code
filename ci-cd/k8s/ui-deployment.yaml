apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-deployment
  namespace: dev
  labels:
    app: quantumvestai
    tier: frontend
    environment: development
    created-by: daparthi001
    created-date: "2025-06-15"
    updated-by: daparthi001
    updated-date: "2025-06-18"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: quantumvestai
      tier: frontend
      environment: development
  template:
    metadata:
      labels:
        app: quantumvestai
        tier: frontend
        environment: development
      annotations:
        timestamp: "20250618024810"
    spec:
      containers:
      - name: ui
        image: 921930869047.dkr.ecr.us-east-1.amazonaws.com/quantumvestai:ui-dev-latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        # Kubernetes secrets
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ui-secrets
              key: JWT_SECRET_KEY
        - name: TWITTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: ui-secrets
              key: TWITTER_API_KEY
        - name: TWITTER_API_SECRET
          valueFrom:
            secretKeyRef:
              name: ui-secrets
              key: TWITTER_API_SECRET
        - name: TWITTER_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: ui-secrets
              key: TWITTER_ACCESS_TOKEN
        - name: TWITTER_ACCESS_SECRET
          valueFrom:
            secretKeyRef:
              name: ui-secrets
              key: TWITTER_ACCESS_SECRET
        # API connection
        - name: API_URL
          value: "http://quantumvestai-dev-api.dev.svc.cluster.local:8000"              
        # UI settings
        - name: THEME_COLOR
          value: "primary"
        - name: ENABLE_ANIMATIONS
          value: "true"
        - name: CACHE_DURATION
          value: "3600"
        # Fix flags
        - name: FIX_IMPORT_PATHS
          value: "true"
        - name: INSTALL_MISSING_DEPS
          value: "true"
        # Health check settings
        - name: HEALTH_CHECK_PATH
          value: "/health"
        - name: HEALTH_CHECK_ENABLED
          value: "true"
        
        # Use the wrapper script to start the application
        command: ["/bin/bash"]
        args: ["-c", "pip install markupsafe && if [ -f /app/utils/template_filters.py ]; then sed -i 's/from jinja2 import Markup/from markupsafe import Markup/g' /app/utils/template_filters.py; fi && if [ -f /app/utils/formatters.py ] && ! grep -q 'def format_large_number' /app/utils/formatters.py; then echo 'def format_large_number(value, decimal_places=1):\\n    \"\"\"Format large numbers with K, M, B, T suffixes\"\"\"\\n    if value is None:\\n        return \"—\"\\n    \\n    try:\\n        value = float(value)\\n        abs_value = abs(value)\\n        sign = \"-\" if value < 0 else \"\"\\n        \\n        if abs_value >= 1e12:\\n            return f\"{sign}{abs_value/1e12:.{decimal_places}f}T\"\\n        elif abs_value >= 1e9:\\n            return f\"{sign}{abs_value/1e9:.{decimal_places}f}B\"\\n        elif abs_value >= 1e6:\\n            return f\"{sign}{abs_value/1e6:.{decimal_places}f}M\"\\n        elif abs_value >= 1e3:\\n            return f\"{sign}{abs_value/1e3:.{decimal_places}f}K\"\\n        else:\\n            return f\"{sign}{abs_value:.{decimal_places}f}\"\\n    except (ValueError, TypeError):\\n        return str(value)' >> /app/utils/formatters.py; fi && if [ -f /app/utils/formatters.py ] && ! grep -q 'def format_change_value' /app/utils/formatters.py; then echo 'def format_change_value(value, include_sign=True, with_color=False, decimal_places=2):\\n    \"\"\"Format a change value (like stock price change)\"\"\"\\n    if value is None:\\n        return \"—\"\\n    \\n    try:\\n        value = float(value)\\n        formatted = f\"{value:.{decimal_places}f}\"\\n        \\n        if include_sign and value > 0:\\n            formatted = f\"+{formatted}\"\\n            \\n        if with_color:\\n            if value > 0:\\n                return f\"<span class=\\\"text-success\\\">{formatted}</span>\"\\n            elif value < 0:\\n                return f\"<span class=\\\"text-danger\\\">{formatted}</span>\"\\n            else:\\n                return f\"<span class=\\\"text-muted\\\">{formatted}</span>\"\\n        \\n        return formatted\\n    except (ValueError, TypeError):\\n        return str(value)' >> /app/utils/formatters.py; fi && if [ -f /app/utils/__init__.py ]; then sed -i 's/from ui\\.utils/from utils/g' /app/utils/__init__.py; fi && if [ -f /scripts/startup-wrapper.sh ]; then /scripts/startup-wrapper.sh; else uvicorn main:app --host 0.0.0.0 --port 3000; fi"]
        
        resources:
          requests:
            cpu: "150m"
            memory: "320Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
            
        # Volume mounts for scripts
        volumeMounts:
        - name: scripts-volume
          mountPath: /scripts
        - name: ui-logs
          mountPath: /app/logs
            
        # Health checks with increased timeouts
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
      
      volumes:
      - name: scripts-volume
        configMap:
          name: ui-scripts
          defaultMode: 0755
      - name: ui-logs
        emptyDir: {}