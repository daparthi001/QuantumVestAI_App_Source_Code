apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-deployment
  namespace: dev
  labels:
    app: quantumvestai
    tier: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quantumvestai
      tier: ui
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: quantumvestai
        tier: ui
    spec:
      containers:
      - name: ui
        image: 921930869047.dkr.ecr.us-east-1.amazonaws.com/quantumvestai:ui-dev-latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        # Kubernetes secrets
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ui-secrets
              key: JWT_SECRET_KEY
        # - name: YAHOO_FINANCE_API_KEY
        #   valueFrom:
        #     secretKeyRef:
        #       name: ui-secrets
        #       key: YAHOO_FINANCE_API_KEY
        - name: TWITTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: ui-secrets
              key: TWITTER_API_KEY
        - name: TWITTER_API_SECRET
          valueFrom:
            secretKeyRef:
              name: ui-secrets
              key: TWITTER_API_SECRET
        - name: TWITTER_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: ui-secrets
              key: TWITTER_ACCESS_TOKEN
              
        - name: TWITTER_ACCESS_SECRET
          valueFrom:
            secretKeyRef:
              name: ui-secrets
              key: TWITTER_ACCESS_SECRET
              
              
        # UI settings
        - name: THEME_COLOR
          value: "primary"
        - name: ENABLE_ANIMATIONS
          value: "true"
        - name: CACHE_DURATION
          value: "3600"
          
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3