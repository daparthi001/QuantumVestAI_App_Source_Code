apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-deployment
  namespace: dev
  labels:
    app: quantumvestai
    tier: frontend
    environment: development
    created-by: daparthi001
    created-date: "2025-06-15"
    updated-by: daparthi001
    updated-date: "2025-06-18"  # Updated today
spec:
  replicas: 2  # Increased for better availability
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Zero-downtime updates
  selector:
    matchLabels:
      app: quantumvestai
      tier: frontend
      environment: development
  template:
    metadata:
      labels:
        app: quantumvestai
        tier: frontend
        environment: development
      annotations:
        timestamp: "20250618020235"  # Updated timestamp for forcing updates
        configmap/checksum: "${CONFIG_MAP_CHECKSUM}"  # Add this placeholder, which can be filled during CI/CD
    spec:
      containers:
      - name: ui
        image: 921930869047.dkr.ecr.us-east-1.amazonaws.com/quantumvestai:ui-dev-latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        # Kubernetes secrets
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ui-secrets
              key: JWT_SECRET_KEY
        - name: TWITTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: ui-secrets
              key: TWITTER_API_KEY
        - name: TWITTER_API_SECRET
          valueFrom:
            secretKeyRef:
              name: ui-secrets
              key: TWITTER_API_SECRET
        - name: TWITTER_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: ui-secrets
              key: TWITTER_ACCESS_TOKEN
        - name: TWITTER_ACCESS_SECRET
          valueFrom:
            secretKeyRef:
              name: ui-secrets
              key: TWITTER_ACCESS_SECRET
        # API connection
        - name: API_URL
          value: "http://quantumvestai-dev-api.dev.svc.cluster.local:8000"              
        # UI settings
        - name: THEME_COLOR
          value: "primary"
        - name: ENABLE_ANIMATIONS
          value: "true"
        - name: CACHE_DURATION
          value: "3600"
        # Fix flags
        - name: FIX_IMPORT_PATHS
          value: "true"
        - name: INSTALL_MISSING_DEPS
          value: "true"
        # Health check settings
        - name: HEALTH_CHECK_PATH
          value: "/health"
        - name: HEALTH_CHECK_ENABLED
          value: "true"
        
        # Use the wrapper script to start the application
        command: ["/bin/bash"]
        args: ["/scripts/startup-wrapper.sh"]
        
        resources:
          requests:
            cpu: "150m"
            memory: "320Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
            
        # Volume mounts for scripts
        volumeMounts:
        - name: scripts-volume
          mountPath: /scripts
        - name: ui-logs
          mountPath: /app/logs
            
        # AWS ALB compatible health checks
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 60  # Increased to allow for fixes and dependency installation
          periodSeconds: 30
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
      
      # Init container to check API availability before starting UI
      initContainers:
      - name: check-api-service
        image: busybox:1.36
        command: ['sh', '-c', 'until wget -T 5 -q -O- http://quantumvestai-dev-api.dev.svc.cluster.local:8000/health || echo "Waiting for API..."; do sleep 2; done']
      
      volumes:
      - name: scripts-volume
        configMap:
          name: ui-scripts
          defaultMode: 0755  # Make scripts executable
      - name: ui-logs
        emptyDir: {}