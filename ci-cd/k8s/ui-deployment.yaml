apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-deployment
  namespace: dev
  labels:
    app: quantumvestai
    tier: frontend
    environment: development
    created-by: daparthi001
    created-date: "2025-06-15"
    updated-by: daparthi001
    updated-date: "2025-06-18"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: quantumvestai
      tier: frontend
      environment: development
  template:
    metadata:
      labels:
        app: quantumvestai
        tier: frontend
        environment: development
      annotations:
        timestamp: "20250618043223"
    spec:
      initContainers:
      - name: fix-app-issues
        image: 921930869047.dkr.ecr.us-east-1.amazonaws.com/quantumvestai:ui-dev-latest
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args:
        - |
          # Install required packages
          echo "Installing required packages..."
          pip install --no-cache-dir markupsafe==2.1.3 jinja2>=3.0.0 fastapi uvicorn python-multipart
          
          # Create necessary directories
          mkdir -p /app/utils /app/controllers /app/templates/dashboard /app/templates/auth /app/static/css /app/auth
          
          # Copy config files to appropriate locations
          echo "Copying template_filters.py..."
          cp /config/utils.template_filters.py /app/utils/template_filters.py
          
          echo "Copying dashboard_controller.py..."
          cp /config/controllers.dashboard_controller.py /app/controllers/dashboard_controller.py
          
          echo "Copying dependencies.py..."
          cp /config/auth.dependencies.py /app/auth/dependencies.py
          
          echo "Copying base.html..."
          cp /config/templates.base.html /app/templates/base.html
          
          echo "Copying dashboard/index.html..."
          cp /config/templates.dashboard.index.html /app/templates/dashboard/index.html
          
          echo "Copying error.html..."
          cp /config/templates.error.html /app/templates/error.html
          
          echo "Copying login.html..."
          cp /config/templates.auth.login.html /app/templates/auth/login.html
          
          echo "Copying startup.sh..."
          cp /config/scripts.startup.sh /app/startup.sh
          chmod +x /app/startup.sh
          
          # Create __init__.py files
          touch /app/utils/__init__.py
          touch /app/controllers/__init__.py
          touch /app/auth/__init__.py
          
          # Fix import paths in any __init__.py files
          echo "Fixing import paths..."
          find /app -name "__init__.py" -exec sed -i 's/from ui\.utils/from utils/g' {} \;
          find /app -name "__init__.py" -exec sed -i 's/from ui\.controllers/from controllers/g' {} \;
          
          echo "All configuration applied"
        volumeMounts:
        - name: app-volume
          mountPath: /app
        - name: ui-config
          mountPath: /config
      containers:
      - name: ui
        image: 921930869047.dkr.ecr.us-east-1.amazonaws.com/quantumvestai:ui-dev-latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        # Kubernetes secrets
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ui-secrets
              key: JWT_SECRET_KEY
        - name: TWITTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: ui-secrets
              key: TWITTER_API_KEY
        - name: TWITTER_API_SECRET
          valueFrom:
            secretKeyRef:
              name: ui-secrets
              key: TWITTER_API_SECRET
        - name: TWITTER_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: ui-secrets
              key: TWITTER_ACCESS_TOKEN
        - name: TWITTER_ACCESS_SECRET
          valueFrom:
            secretKeyRef:
              name: ui-secrets
              key: TWITTER_ACCESS_SECRET
        # API connection
        - name: API_URL
          value: "http://quantumvestai-dev-api.dev.svc.cluster.local:8000"
        # UI settings
        - name: THEME_COLOR
          value: "primary"
        - name: ENABLE_ANIMATIONS
          value: "true"
        - name: CACHE_DURATION
          value: "3600"
        # Fix flags
        - name: FIX_IMPORT_PATHS
          value: "true"
        - name: INSTALL_MISSING_DEPS
          value: "true"
        # Health check settings
        - name: HEALTH_CHECK_PATH
          value: "/health"
        - name: HEALTH_CHECK_ENABLED
          value: "true"
        
        # Use startup script from config
        command: ["/bin/bash", "-c"]
        args:
        - |
          cd /app
          /app/startup.sh
        
        resources:
          requests:
            cpu: "150m"
            memory: "320Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
            
        # Volume mounts
        volumeMounts:
        - name: ui-logs
          mountPath: /app/logs
        - name: app-volume
          mountPath: /app
            
        # Health checks with increased timeouts
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
      
      volumes:
      - name: ui-logs
        emptyDir: {}
      - name: app-volume
        emptyDir: {}
      - name: ui-config
        configMap:
          name: ui-config
          defaultMode: 0755