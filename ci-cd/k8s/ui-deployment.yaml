apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-deployment
  namespace: dev
  labels:
    app: quantumvestai
    tier: frontend
    environment: development
    version: v1.5.2
  annotations:
    kubernetes.io/change-cause: "Fixed UI deployment issues - 2025-06-20 03:37:22"
    updated-by: "daparthi001"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: quantumvestai
      tier: frontend
      environment: development
  template:
    metadata:
      labels:
        app: quantumvestai
        tier: frontend
        environment: development
        version: v1.5.2
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: ui
        image: 921930869047.dkr.ecr.us-east-1.amazonaws.com/quantumvestai:ui-dev-latest
        imagePullPolicy: Always
        env:
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ui-secrets
              key: JWT_SECRET_KEY
        - name: TWITTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: ui-secrets
              key: TWITTER_API_KEY
        - name: TWITTER_API_SECRET
          valueFrom:
            secretKeyRef:
              name: ui-secrets
              key: TWITTER_API_SECRET
        - name: TWITTER_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: ui-secrets
              key: TWITTER_ACCESS_TOKEN
        - name: TWITTER_ACCESS_SECRET
          valueFrom:
            secretKeyRef:
              name: ui-secrets
              key: TWITTER_ACCESS_SECRET
        # API connection - explicit URL to ensure access from UI
        - name: API_URL
          value: "http://quantumvestai-dev-api.dev.svc.cluster.local:8000"
        # Add environment variables to enable all endpoints
        - name: ENABLE_ALL_ENDPOINTS
          value: "true"
        - name: ENABLE_AUTH_ENDPOINTS
          value: "true"
        - name: ENABLE_DATA_ENDPOINTS
          value: "true"
        - name: ENABLE_TRADING_ENDPOINTS
          value: "true"
        - name: API_TIMEOUT
          value: "30000"
        - name: API_RETRY_ATTEMPTS
          value: "3"
        # UI settings
        - name: THEME_COLOR
          value: "primary"
        - name: ENABLE_ANIMATIONS
          value: "true"
        - name: CACHE_DURATION
          value: "3600"
        # Fix flags
        - name: FIX_IMPORT_PATHS
          value: "true"
        - name: INSTALL_MISSING_DEPS
          value: "true"
        - name: ENABLE_API_PROXY
          value: "true"
        - name: ENABLE_CORS
          value: "true"
        # Health check settings
        - name: HEALTH_CHECK_PATH
          value: "/health"
        - name: HEALTH_CHECK_ENABLED
          value: "true"
        - name: PORT
          value: "3000"
        - name: HOST
          value: "0.0.0.0"
        
        # Use startup script from container
        command: ["/bin/bash", "-c"]
        args:
        - |
          cd /app
          # Create health check endpoint
          mkdir -p /app/public/health
          cat > /app/public/health/index.html << EOF
          {
            "status": "healthy",
            "apiUrl": "${API_URL}",
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF
          # Start the application
          echo "Starting application with API_URL=${API_URL}"
          chmod +x /app/scripts/start.sh && /app/scripts/start.sh
        
        resources:
          requests:
            cpu: "2"
            memory: "2Gi"
          limits:
            cpu: "4"
            memory: "4Gi"
            
        # Volume mounts - simplified to only include logs volume
        volumeMounts:
        - name: ui-logs
          mountPath: /app/logs
            
        # Health checks with appropriate timeouts for container startup
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
      
      volumes:
      - name: ui-logs
        emptyDir: {}
      - name: ui-config
        configMap:
          name: ui-config
          defaultMode: 0755