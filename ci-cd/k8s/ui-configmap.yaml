  "templates.dashboard.index.html": |
    {% extends "base.html" %}

    {% block title %}QuantumVestAI Dashboard{% endblock %}

    {% block content %}
    <div class="dashboard-container">
      <div class="row">
        <div class="col-12">
          <h1>Welcome, {{ data.user.display_name | default(data.user.username) }}</h1>
          <p class="text-muted">{{ data.timestamp }}</p>
        </div>
      </div>

      <!-- Market Overview Section -->
      <div class="card mb-4">
        <div class="card-header">
          <h2 class="h5 mb-0">Market Overview</h2>
        </div>
        <div class="card-body">
          {% if data.market and data.market.status != "unavailable" and data.market.status != "error" %}
            <div class="row">
              {% if data.market.indices %}
                <div class="col-md-6">
                  <h3 class="h6">Market Indices</h3>
                  <table class="table table-sm">
                    <thead>
                      <tr>
                        <th>Index</th>
                        <th>Value</th>
                        <th>Change</th>
                      </tr>
                    </thead>
                    <tbody>
                      {% for index in data.market.indices %}
                        <tr>
                          <td>{{ index.name }}</td>
                          <td>{{ index.value }}</td>
                          <td class="{{ 'text-success' if index.change > 0 else 'text-danger' }}">
                            {{ index.change }}
                          </td>
                        </tr>
                      {% endfor %}
                    </tbody>
                  </table>
                </div>
              {% endif %}
              
              {% if data.market.trends %}
                <div class="col-md-6">
                  <h3 class="h6">Market Trends</h3>
                  <ul class="list-group">
                    {% for trend in data.market.trends %}
                      <li class="list-group-item">
                        {{ trend.description }}
                      </li>
                    {% endfor %}
                  </ul>
                </div>
              {% endif %}
            </div>
          {% else %}
            <div class="alert alert-info">Market data currently unavailable.</div>
          {% endif %}
        </div>
      </div>

      <!-- Status Message -->
      <div class="alert alert-success">
        <strong>Success!</strong> Application running with proper template rendering. Updated at 2025-06-18 04:32:23 UTC.
      </div>
    </div>
    {% endblock %}

    {% block scripts %}
    <script>
      console.log("QuantumVestAI Dashboard Loaded Successfully");
    </script>
    {% endblock %}

