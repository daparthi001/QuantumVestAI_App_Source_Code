    """
    Dashboard Controller for QuantumVestAI
    Created: 2025-06-17 20:54:48
    Updated: 2025-06-18 04:32:23
    Author: daparthi001
    """
    import os
    import aiohttp
    import logging
    from fastapi import APIRouter, Request, Depends, HTTPException
    from fastapi.responses import HTMLResponse
    from fastapi.templating import Jinja2Templates
    from datetime import datetime
    from pathlib import Path
    
    # Skip import if not available in this deployment
    try:
        from auth.dependencies import get_current_user
    except ImportError:
        def get_current_user(request):
            """Mock user for testing"""
            return {
                "username": "demo",
                "display_name": "Demo User",
                "email": "demo@example.com"
            }

    router = APIRouter()
    logger = logging.getLogger("quantumvestai.dashboard_controller")

    # Get API URL from environment or use default
    API_URL = os.environ.get("API_URL", "http://quantumvestai-dev-api:8000")
    API_V1_URL = f"{API_URL}/api/v1"

    # Get templates from the correct location using relative path
    BASE_DIR = Path(__file__).resolve().parent.parent
    templates = Jinja2Templates(directory=str(BASE_DIR / "templates"))

    @router.get("/dashboard", response_class=HTMLResponse)
    async def dashboard(request: Request):
        """Main dashboard with fallback for authentication"""
        # Try to get user from dependencies, fallback to mock user
        try:
            user = get_current_user(request)
        except:
