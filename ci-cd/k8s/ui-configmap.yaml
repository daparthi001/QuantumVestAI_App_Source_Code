apiVersion: v1
kind: ConfigMap
metadata:
  name: ui-config
  namespace: dev
  labels:
    app: quantumvestai
    tier: frontend
    environment: development
    created-by: daparthi001
    created-date: "2025-06-15"
    updated-by: daparthi001
    updated-date: "2025-06-18"
data:
  "scripts.startup.sh": |
    #!/bin/bash
    
    echo "QuantumVestAI UI starting up..."
    echo "Current directory: $(pwd)"
    echo "Python path: $PYTHONPATH"
    
    # Make sure markupsafe is installed
    pip install --no-cache-dir markupsafe==2.1.3
    
    # Start the application
    cd /app
    export PYTHONPATH=/app/core:/app/ai-stock-platform:/app/ai-stock-platform/api:/app/api:/app/ui:/app
    python -m uvicorn main:app --host 0.0.0.0 --port 3000