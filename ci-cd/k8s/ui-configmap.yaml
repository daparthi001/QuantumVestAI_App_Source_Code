                    {"name": "S&P 500", "value": 4586.23, "change": 23.45},
                    {"name": "Dow Jones", "value": 35893.67, "change": 145.12},
                    {"name": "Nasdaq", "value": 15012.36, "change": -34.67}
                ],
                "trends": [
                    {"description": "Tech stocks showing strong momentum"},
                    {"description": "Financial sector under pressure"},
                    {"description": "Healthcare stocks mixed on policy news"}
                ]
            }
            
            # Only try to fetch real data if aiohttp is available
            try:
                async with aiohttp.ClientSession() as session:
                    pass
            except:
                # If aiohttp fails, don't attempt API calls
                return templates.TemplateResponse(
                    "dashboard/index.html",
                    {"request": request, "data": dashboard_data}
                )
            
            # Make real API calls with aiohttp
            async with aiohttp.ClientSession() as session:
                try:
                    # Add more API calls here later
                    pass
                except Exception as e:
                    logger.error(f"API error: {str(e)}")

            return templates.TemplateResponse(
                "dashboard/index.html",
                {"request": request, "data": dashboard_data}
            )
        except Exception as e:
            logger.error(f"Dashboard error: {str(e)}")
            # Create a simple error response if template rendering fails
            error_html = f"""
            <!DOCTYPE html>
            <html>
            <head>
                <title>QuantumVestAI Dashboard</title>
