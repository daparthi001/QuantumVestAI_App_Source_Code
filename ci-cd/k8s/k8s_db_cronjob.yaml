apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  namespace: dev
  labels:
    app: quantumvestai
    component: db-backup
    environment: dev
spec:
  schedule: "0 2 * * *"  # Run daily at 2 AM UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: quantumvestai
            component: db-backup
            environment: dev
        spec:
          containers:
          - name: db-backup
            image: postgres:14
            command:
            - /bin/bash
            - -c
            - |
              # Get current date in YYYY-MM-DD format
              BACKUP_DATE=$(date +%Y-%m-%d)
              
              # Create backup
              echo "Starting database backup..."
              PGPASSWORD="$DB_PASSWORD" pg_dump -h $DB_HOST -U $DB_USER -d $DB_NAME -F c -f /backups/quantumvestai-$BACKUP_DATE.dump
              
              # Verify backup file exists
              if [ -f "/backups/quantumvestai-$BACKUP_DATE.dump" ]; then
                echo "Backup completed successfully"
                
                # Copy to S3 (if AWS CLI installed)
                if command -v aws &> /dev/null; then
                  echo "Uploading backup to S3..."
                  aws s3 cp /backups/quantumvestai-$BACKUP_DATE.dump s3://quantumvestai-db-backups-dev/quantumvestai-$BACKUP_DATE.dump
                fi
                
                # Delete backups older than 7 days (adjust retention as needed)
                echo "Removing old backups..."
                find /backups -name "quantumvestai-*.dump" -type f -mtime +7 -delete
              else
                echo "Backup failed"
                exit 1
              fi
            resources:
              requests:
                memory: "256Mi"
                cpu: "200m"
              limits:
                memory: "512Mi"
                cpu: "500m"
            env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: quantumvestai-cluster-rds-credentials
                  key: endpoint  # Changed from host to endpoint
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: quantumvestai-cluster-rds-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quantumvestai-cluster-rds-credentials
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: quantumvestai-cluster-rds-credentials
                  key: database  # Changed from dbname to database
            - name: AWS_REGION
              value: "us-east-1"
            volumeMounts:
            - name: backup-volume
              mountPath: /backups
          volumes:
          - name: backup-volume
            persistentVolumeClaim:
              claimName: quantumvestai-pvc
          restartPolicy: OnFailure