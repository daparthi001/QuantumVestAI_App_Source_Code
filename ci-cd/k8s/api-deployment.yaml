# QuantumVestAI Kubernetes Deployment Configuration
# Created: 2025-05-19 03:49:42
# Author: daparthi001

apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantumvestai
  namespace: quantumvestai
  labels:
    app: quantumvestai
    version: v1.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: quantumvestai
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: quantumvestai
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: quantumvestai-sa
      containers:
        - name: api
          image: 921930869047.dkr.ecr.us-east-1.amazonaws.com/quantumvestai:api-dev-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
            - name: POSTGRES_SERVER
              valueFrom:
                secretKeyRef:
                  name: quantumvestai-secrets
                  key: postgres-server
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: quantumvestai-secrets
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quantumvestai-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              value: "quantumvestai"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: quantumvestai-secrets
                  key: jwt-secret
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: quantumvestai-secrets
                  key: redis-url
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: logs
          emptyDir: {}
        - name: uploads
          persistentVolumeClaim:
            claimName: quantumvestai-pvc