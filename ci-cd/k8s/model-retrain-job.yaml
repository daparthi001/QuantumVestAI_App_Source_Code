apiVersion: batch/v1
kind: CronJob
metadata:
  name: model-retrain-job
  namespace: dev
  labels:
    app: quantumvestai
    component: ml-training
spec:
  schedule: "0 2 * * 0"  # Run weekly on Sunday at 2:00 AM UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 14400  # 4 hours timeout
      template:
        metadata:
          labels:
            app: quantumvestai
            component: ml-training
        spec:
          serviceAccountName: quantumvestai-sa
          restartPolicy: Never
          containers:
          - name: model-trainer
            image: 921930869047.dkr.ecr.us-east-1.amazonaws.com/quantumvestai:api-dev-latest
            imagePullPolicy: Always
            command: ["python", "-m", "api.ml.train_models"]
            args: ["--full-retrain", "--all-models"]
            resources:
              requests:
                cpu: "1000m"
                memory: "4Gi"
              limits:
                cpu: "2000m"
                memory: "8Gi"
            env:
              # Database credentials from Terraform-created secret
              - name: DB_HOST
                valueFrom:
                  secretKeyRef:
                    name: quantumvestai-cluster-rds-credentials
                    key: host
              - name: DB_PORT
                valueFrom:
                  secretKeyRef:
                    name: quantumvestai-cluster-rds-credentials
                    key: port
              - name: DB_NAME
                valueFrom:
                  secretKeyRef:
                    name: quantumvestai-cluster-rds-credentials
                    key: database
              - name: DB_USER
                valueFrom:
                  secretKeyRef:
                    name: quantumvestai-cluster-rds-credentials
                    key: username
              - name: DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: quantumvestai-cluster-rds-credentials
                    key: password
              # Environment variables
              - name: ENVIRONMENT
                valueFrom:
                  configMapKeyRef:
                    name: api-configmap
                    key: ENVIRONMENT
              - name: AWS_REGION
                valueFrom:
                  configMapKeyRef:
                    name: api-configmap
                    key: AWS_REGION
              - name: MODELS_STORAGE_PATH
                value: "/app/models"
              - name: S3_MODEL_BUCKET
                value: "quantumvestai-models-dev"
              # API keys from app-secrets
              - name: ALPHA_VANTAGE_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: app-secrets
                    key: ALPHA_VANTAGE_API_KEY
              - name: RAPIDAPI_KEY
                valueFrom:
                  secretKeyRef:
                    name: app-secrets
                    key: RAPIDAPI_KEY
            volumeMounts:
            - name: models-storage
              mountPath: /app/models
          volumes:
          - name: models-storage
            persistentVolumeClaim:
              claimName: models-storage