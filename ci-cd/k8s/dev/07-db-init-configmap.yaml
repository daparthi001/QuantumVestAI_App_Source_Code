# Database Initialization ConfigMap
# Created: 2025-05-20 06:15:55
# Author: daparthi001
# Updated: 2025-06-15 04:30:45 by daparthi001

apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init-config
  namespace: dev
  labels:
    environment: development
    app: quantumvestai
    component: db-init
data:
  alembic.ini: |
    [alembic]
    script_location = api/alembic
    # Use RDS environment variables for connectivity
    sqlalchemy.url = postgresql://$(RDS_USERNAME):$(RDS_PASSWORD)@$(RDS_HOST):$(RDS_PORT)/$(RDS_DBNAME)
    file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(rev)s_%%(slug)s
    timezone = UTC
    # Ensure PYTHONPATH is set for Alembic migrations
    PYTHONPATH = /app/ai-stock-platform:/app/ai-stock-platform/api

  wait-for-db.sh: |
    #!/bin/sh
    # wait-for-db.sh - Script to check RDS PostgreSQL availability
    # Updated: 2025-06-15 04:30:45
    # Author: daparthi001
    
    set -e
    
    # Log function for clarity
    log() {
      echo "[$(date +'%Y-%m-%d %H:%M:%S')] $*"
    }
    
    # Map secret keys to PostgreSQL environment variables
    export PGHOST=${host}
    export PGPORT=${port}
    export PGDATABASE=${dbname}
    export PGUSER=${username}
    export PGPASSWORD=${password}
    
    log "Waiting for RDS PostgreSQL to be available at ${PGHOST}:${PGPORT}..."
    
    # Maximum number of attempts
    MAX_ATTEMPTS=30
    # Delay between attempts in seconds
    DELAY=5
    
    # Loop to check database availability
    for i in $(seq 1 $MAX_ATTEMPTS); do
      log "Attempt $i of $MAX_ATTEMPTS"
      
      # Try connecting to the database
      if pg_isready -t 5; then
        log "Database server is available!"
        
        # Try a simple query to verify credentials and database access
        if psql -c "SELECT 1" >/dev/null 2>&1; then
          log "Database connection successful!"
          exit 0
        else
          log "Connected to database server but could not execute query. Checking credentials..."
        fi
      fi
      
      log "Database is unavailable - sleeping for ${DELAY}s"
      sleep $DELAY
    done
    
    log "Could not connect to database after $MAX_ATTEMPTS attempts"
    exit 1

  seed-data.json: |
    {
      "initial_data": {
        "roles": [
          {"name": "admin", "description": "Administrator"},
          {"name": "user", "description": "Regular user"}
        ],
        "settings": {
          "max_portfolio_size": 100,
          "default_currency": "USD",
          "trading_hours_start": "09:30",
          "trading_hours_end": "16:00",
          "timezone": "America/New_York"
        }
      }
    }