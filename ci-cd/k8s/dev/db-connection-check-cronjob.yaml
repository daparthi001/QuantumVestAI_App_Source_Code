# Database Connection Check CronJob
# Created: 2025-05-20 08:03:38
# Author: daparthi001

apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-connection-check
  namespace: dev
  labels:
    environment: development
    app: quantumvestai
    component: monitoring
    created-by: daparthi001
    created-date: "2025-05-20"
spec:
  schedule: "*/5 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Replace
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: connection-check
            image: postgres:13-alpine
            env:
              - name: DB_HOST
                value: "quantumvestai-dev.cwbsqsiywwaa.us-east-1.rds.amazonaws.com"
              - name: DB_PORT
                value: "5432"
              - name: DB_USER
                value: "dbadmin"
              - name: DB_NAME
                value: "quantumvestaidb"
              - name: DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: quantumvestai-cluster-rds-credentials
                    key: password
              - name: PGSSLMODE
                value: "require"
            command:
              - /bin/sh
              - -c
              - |
                export PGPASSWORD="$DB_PASSWORD"
                if psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -c '\conninfo'; then
                  echo "Connection check successful at $(date -u)"
                  exit 0
                else
                  echo "Connection check failed at $(date -u)"
                  exit 1
                fi
          restartPolicy: OnFailure