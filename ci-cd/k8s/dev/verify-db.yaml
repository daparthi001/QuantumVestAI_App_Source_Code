# Secret Verification Job
# Created: 2025-05-20 07:24:47
# Author: daparthi001

apiVersion: batch/v1
kind: Job
metadata:
  name: verify-rds-credentials
  namespace: dev
  labels:
    environment: development
    app: quantumvestai
    component: secret-verify
    created-by: daparthi001
    created-date: "2025-05-20"
spec:
  backoffLimit: 1
  template:
    spec:
      containers:
      - name: verify-secrets
        image: postgres:13-alpine
        command: 
        - /bin/sh
        - -c
        - |
          echo "Verifying RDS credentials..."
          export PGPASSWORD=$DB_PASSWORD
          psql -h $DB_HOST -p $DB_PORT -U $DB_USER -d $DB_NAME -c '\l' && \
          echo "Successfully connected to database!"
        env:
          - name: DB_HOST
            valueFrom:
              secretKeyRef:
                name: quantumvestai-cluster-rds-credentials
                key: POSTGRES_HOST
          - name: DB_PORT
            valueFrom:
              secretKeyRef:
                name: quantumvestai-cluster-rds-credentials
                key: POSTGRES_PORT
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: quantumvestai-cluster-rds-credentials
                key: POSTGRES_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: quantumvestai-cluster-rds-credentials
                key: POSTGRES_PASSWORD
          - name: DB_NAME
            valueFrom:
              secretKeyRef:
                name: quantumvestai-cluster-rds-credentials
                key: POSTGRES_DB
      restartPolicy: Never