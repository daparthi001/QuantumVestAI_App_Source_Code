# Development API Deployment
# Created: 2025-05-20 06:12:45
# Author: daparthi001

apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantumvest-dev-api
  namespace: quantumvest-dev
  labels:
    environment: development
    app: quantumvest
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quantumvest
      tier: backend
      environment: development
  template:
    metadata:
      labels:
        app: quantumvest
        tier: backend
        environment: development
    spec:
      containers:
        - name: api
          image: quantumvest-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: quantumvest-dev-config
            - secretRef:
                name: quantumvest-dev-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: api-logs
              mountPath: /app/logs
      volumes:
        - name: api-logs
          emptyDir: {}