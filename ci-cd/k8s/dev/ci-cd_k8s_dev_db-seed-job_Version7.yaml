# Database Seeding Job
# Created: 2025-05-20 08:20:20
# Author: daparthi001

apiVersion: v1
kind: ConfigMap
metadata:
  name: db-seed-scripts
  namespace: dev
  labels:
    app: quantumvestai
    component: db-seed
    created-by: daparthi001
    created-date: "2025-05-20"
data:
  seed_db.py: |
    #!/usr/bin/env python3
    # Database Seeding Script
    # Created: 2025-05-20 08:20:20
    # Author: daparthi001
    
    import os
    import sys
    import psycopg2
    from datetime import datetime
    import logging
    
    logging.basicConfig(
        level=logging.INFO,
        format='%(asctime)s - %(levelname)s - %(message)s'
    )
    logger = logging.getLogger(__name__)
    
    DB_CONFIG = {
        'dbname': os.getenv('DB_NAME', 'quantumvestaidb'),
        'user': os.getenv('DB_USER', 'dbadmin'),
        'password': os.getenv('DB_PASSWORD'),
        'host': os.getenv('DB_HOST'),
        'port': os.getenv('DB_PORT', '5432'),
        'sslmode': 'require'
    }
    
    TABLES = {
        'users': """
            CREATE TABLE IF NOT EXISTS users (
                id SERIAL PRIMARY KEY,
                username VARCHAR(50) UNIQUE NOT NULL,
                email VARCHAR(255) UNIQUE NOT NULL,
                first_name VARCHAR(50),
                last_name VARCHAR(50),
                created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
                updated_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP
            );
        """,
        'portfolios': """
            CREATE TABLE IF NOT EXISTS portfolios (
                id SERIAL PRIMARY KEY,
                user_id INTEGER REFERENCES users(id),
                name VARCHAR(100) NOT NULL,
                description TEXT,
                risk_level VARCHAR(20),
                created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
                updated_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
                UNIQUE(user_id, name)
            );
        """,
        'investments': """
            CREATE TABLE IF NOT EXISTS investments (
                id SERIAL PRIMARY KEY,
                portfolio_id INTEGER REFERENCES portfolios(id),
                symbol VARCHAR(10) NOT NULL,
                quantity DECIMAL(15,6) NOT NULL,
                purchase_price DECIMAL(15,2) NOT NULL,
                purchase_date TIMESTAMPTZ NOT NULL,
                created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
                updated_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP
            );
        """
        'user_preferences': """
            CREATE TABLE IF NOT EXISTS user_preferences (
                id SERIAL PRIMARY KEY,
                user_id INTEGER REFERENCES users(id),
                theme VARCHAR(20) DEFAULT 'light',
                default_forecast_days INTEGER DEFAULT 7,
                default_model VARCHAR(50) DEFAULT 'ensemble',
                created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
                updated_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
                UNIQUE(user_id)
            );
        """,
    }
    
    INDEXES = [
        "CREATE INDEX IF NOT EXISTS idx_users_email ON users(email);",
        "CREATE INDEX IF NOT EXISTS idx_users_username ON users(username);",
        "CREATE INDEX IF NOT EXISTS idx_portfolios_user_id ON portfolios(user_id);",
        "CREATE INDEX IF NOT EXISTS idx_investments_portfolio_id ON investments(portfolio_id);",
        "CREATE INDEX IF NOT EXISTS idx_investments_symbol ON investments(symbol);",
        "CREATE INDEX IF NOT EXISTS idx_investments_purchase_date ON investments(purchase_date);",
        "CREATE INDEX IF NOT EXISTS idx_user_preferences_user_id ON user_preferences(user_id);"
    ]
    
    SAMPLE_DATA = [
        """
        INSERT INTO users (username, email, first_name, last_name)
        VALUES 
            ('testuser1', 'test1@quantumvest.ai', 'Test', 'User1'),
            ('testuser2', 'test2@quantumvest.ai', 'Test', 'User2')
        ON CONFLICT (username) DO NOTHING;
        """,
        """
        INSERT INTO portfolios (user_id, name, description, risk_level)
        SELECT id, 'Growth Portfolio', 'High growth technology focused portfolio', 'HIGH'
        FROM users WHERE username = 'testuser1'
        ON CONFLICT DO NOTHING;
        """,
        """
        INSERT INTO investments (portfolio_id, symbol, quantity, purchase_price, purchase_date)
        SELECT p.id, 'AAPL', 10.0, 150.00, CURRENT_TIMESTAMP
        FROM portfolios p
        JOIN users u ON p.user_id = u.id
        WHERE u.username = 'testuser1'
        ON CONFLICT DO NOTHING;
        """
        """
        INSERT INTO user_preferences (user_id, theme, default_forecast_days, default_model)
        SELECT id, 'light', 7, 'ensemble'
        FROM users
        WHERE username = 'testuser1'
        ON CONFLICT (user_id) DO NOTHING;
        """
        """
        INSERT INTO user_preferences (user_id, theme, default_forecast_days, default_model)
        SELECT id, 'dark', 14, 'ensemble'
        FROM users
        WHERE username = 'testuser2'
        ON CONFLICT (user_id) DO NOTHING;
        """
    ]
    
    def init_db():
        logger.info(f"Connecting to database: {DB_CONFIG['dbname']} on {DB_CONFIG['host']}")
        try:
            conn = psycopg2.connect(**DB_CONFIG)
            conn.autocommit = True
            cur = conn.cursor()
            
            # Create tables
            for table_name, create_sql in TABLES.items():
                logger.info(f"Creating table: {table_name}")
                cur.execute(create_sql)
            
            # Create indexes
            for index_sql in INDEXES:
                logger.info(f"Creating index: {index_sql}")
                cur.execute(index_sql)
            
            # Insert sample data
            for insert_sql in SAMPLE_DATA:
                logger.info("Inserting sample data")
                cur.execute(insert_sql)
            
            # Verify data
            cur.execute("SELECT COUNT(*) FROM users")
            user_count = cur.fetchone()[0]
            logger.info(f"Verified users count: {user_count}")
            
            cur.close()
            conn.close()
            logger.info("Database initialization completed successfully")
            return True
            
        except Exception as e:
            logger.error(f"Error initializing database: {e}")
            return False
    
    if __name__ == "__main__":
        logger.info(f"Starting database initialization at {datetime.utcnow().isoformat()}")
        if not DB_CONFIG['password']:
            logger.error("Database password not set")
            sys.exit(1)
        
        success = init_db()
        sys.exit(0 if success else 1)

---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-seed
  namespace: dev
  labels:
    app: quantumvestai
    component: db-seed
    created-by: daparthi001
    created-date: "2025-05-20"
spec:
  backoffLimit: 2
  template:
    spec:
      containers:
      - name: db-seed
        image: python:3.9-alpine
        command:
        - /bin/sh
        - -c
        - |
          echo "=== Starting Database Seeding at $(date -u) ==="
          
          # Install required packages
          apk add --no-cache postgresql-dev gcc python3-dev musl-dev
          
          # Install Python dependencies
          pip install psycopg2-binary
          
          # Run seeding script
          python /app/scripts/seed_db.py
          
          # Check exit status
          if [ $? -eq 0 ]; then
            echo "✅ Database seeding completed successfully"
          else
            echo "❌ Database seeding failed"
            exit 1
          fi
        env:
        - name: DB_HOST
          value: "quantumvestai-dev.cwbsqsiywwaa.us-east-1.rds.amazonaws.com"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "dbadmin"
        - name: DB_NAME
          value: "quantumvestaidb"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: quantumvestai-cluster-rds-credentials
              key: password
        - name: PYTHONUNBUFFERED
          value: "1"
        volumeMounts:
        - name: scripts
          mountPath: /app/scripts
      volumes:
      - name: scripts
        configMap:
          name: db-seed-scripts
          defaultMode: 0755
      restartPolicy: OnFailure