# QuantumVestAI API Deployment
# Created: 2025-05-20 08:40:06
# Author: daparthi001

apiVersion: v1
kind: Service
metadata:
  name: quantumvestai-dev-api
  namespace: dev
  labels:
    app: quantumvestai
    tier: backend
    environment: development
spec:
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: quantumvestai
    tier: backend
    environment: development
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantumvestai-dev-api
  namespace: dev
  labels:
    app: quantumvestai
    tier: backend
    environment: development
    created-by: daparthi001
    created-date: "2025-05-20"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quantumvestai
      tier: backend
      environment: development
  template:
    metadata:
      labels:
        app: quantumvestai
        tier: backend
        environment: development
      annotations:
        timestamp: "2025-05-20-084006"
    spec:
      containers:
      - name: api
        image: 921930869047.dkr.ecr.us-east-1.amazonaws.com/quantumvestai:api-dev-latest
        imagePullPolicy: Always
        env:
          # Database Configuration
          - name: DB_HOST
            value: "quantumvestai-dev-db.dev.svc.cluster.local"
          - name: DB_PORT
            value: "5432"
          - name: DB_NAME
            value: "quantumvestaidb"
          - name: DB_USER
            value: "dbadmin"
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: quantumvestai-cluster-rds-credentials
                key: password
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"