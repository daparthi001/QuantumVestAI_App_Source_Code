apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantumvestai-api
  namespace: dev
  labels:
    app: quantumvestai
    tier: backend
    environment: development
    updated: "20250619060751"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: quantumvestai
      tier: backend
      environment: development
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: quantumvestai
        tier: backend
        environment: development
        updated: "20250619060751"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: api
        image: 921930869047.dkr.ecr.us-east-1.amazonaws.com/quantumvestai:api-prod-20250619
        ports:
        - containerPort: 8000
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: quantumvestai-cluster-rds-credentials
              key: host
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: quantumvestai-cluster-rds-credentials
              key: port
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: quantumvestai-cluster-rds-credentials
              key: database
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: quantumvestai-cluster-rds-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: quantumvestai-cluster-rds-credentials
              key: password
        - name: PYTHONPATH
          value: /app
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: API_ENV
          value: development
        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          timeoutSeconds: 2
          periodSeconds: 60
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          timeoutSeconds: 2
          periodSeconds: 30
          failureThreshold: 3