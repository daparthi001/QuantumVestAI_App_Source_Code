apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantumvestai-dev-api
  namespace: dev
  labels:
    app: quantumvestai
    tier: backend
    environment: development
    updated: "20250619071120"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quantumvestai
      tier: backend
      environment: development
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: quantumvestai
        tier: backend
        environment: development
        updated: "20250619071120"
    spec:
      containers:
      - name: api
        image: 921930869047.dkr.ecr.us-east-1.amazonaws.com/quantumvestai:api-dev-latest
        imagePullPolicy: Always
        command: ["uvicorn"]
        args: ["main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
        ports:
        - containerPort: 8000
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: quantumvestai-cluster-rds-credentials
              key: host
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: quantumvestai-cluster-rds-credentials
              key: port
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: quantumvestai-cluster-rds-credentials
              key: database
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: quantumvestai-cluster-rds-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: quantumvestai-cluster-rds-credentials
              key: password
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ui-secrets
              key: JWT_SECRET_KEY
        - name: TWITTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: ui-secrets
              key: TWITTER_API_KEY
        - name: TWITTER_API_SECRET
          valueFrom:
            secretKeyRef:
              name: ui-secrets
              key: TWITTER_API_SECRET
        - name: TWITTER_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: ui-secrets
              key: TWITTER_ACCESS_TOKEN
        - name: TWITTER_ACCESS_SECRET
          valueFrom:
            secretKeyRef:
              name: ui-secrets
              key: TWITTER_ACCESS_SECRET
        - name: ALPHA_VANTAGE_API_KEY
          valueFrom:
            secretKeyRef:
              name: ui-secrets
              key: ALPHA_VANTAGE_API_KEY
        - name: RAPIDAPI_KEY
          valueFrom:
            secretKeyRef:
              name: ui-secrets
              key: RAPIDAPI_KEY
        - name: ENABLE_REAL_DATA
          value: "true"
        - name: PYTHONPATH
          value: /app/core:/app/ai-stock-platform:/app/core:/app/api:/app
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: API_ENV
          value: development
        resources:

          requests:
            cpu: 250m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          timeoutSeconds: 2
          periodSeconds: 60
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          timeoutSeconds: 2
          periodSeconds: 30
          failureThreshold: 3