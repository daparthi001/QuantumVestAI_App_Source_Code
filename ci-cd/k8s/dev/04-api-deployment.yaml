apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantumvestai-dev-api
  namespace: dev
  labels:
    app: quantumvestai
    tier: backend
    environment: development
    updated: "20250617153026"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quantumvestai
      tier: backend
      environment: development
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: quantumvestai
        tier: backend
        environment: development
        updated: "20250617153026"
    spec:
      containers:
      - name: api
        image: 921930869047.dkr.ecr.us-east-1.amazonaws.com/quantumvestai:api-dev-latest
        ports:
        - containerPort: 8000
        command:
        - /bin/sh
        - -c
        args:
        - |
          echo "=== Creating API Structure ==="
          mkdir -p /app/api
          mkdir -p /app/api/routers
          mkdir -p /app/core
          mkdir -p /app/db
          
          # Database session
          cat > /app/db/__init__.py << 'EOT'
          # Database package
          EOT
          
          cat > /app/db/session.py << 'EOT'
          """
          Database Session Module
          Created: 2025-06-17 15:30:26
          Author: daparthi001
          """
          import os
          import logging
          from sqlalchemy import create_engine, text
          from sqlalchemy.ext.declarative import declarative_base
          from sqlalchemy.orm import sessionmaker

          # Configure logging
          logging.basicConfig(level=logging.INFO)
          logger = logging.getLogger("db_session")

          # Get database connection details from environment variables
          DB_HOST = os.getenv("DB_HOST", "localhost")
          DB_PORT = os.getenv("DB_PORT", "5432")
          DB_NAME = os.getenv("DB_NAME", "quantumvestai")
          DB_USER = os.getenv("DB_USER", "postgres")
          DB_PASSWORD = os.getenv("DB_PASSWORD", "postgres")

          # Construct database URL
          DATABASE_URL = f"postgresql://{DB_USER}:{DB_PASSWORD}@{DB_HOST}:{DB_PORT}/{DB_NAME}"

          try:
              # Create SQLAlchemy engine with custom parameters for better connection handling
              engine = create_engine(
                  DATABASE_URL,
                  pool_pre_ping=True,
                  pool_recycle=300,
                  pool_size=5,
                  max_overflow=10,
                  connect_args={"connect_timeout": 10}
              )
              
              # Test connection when module is loaded
              with engine.connect() as conn:
                  result = conn.execute(text("SELECT 1")).scalar()
                  logger.info(f"Database connection established successfully")
                  
              # Create sessionmaker
              SessionLocal = sessionmaker(autocommit=False, autoflush=False, bind=engine)
              
              # Create Base class for models
              Base = declarative_base()
              
          except Exception as e:
              logger.error(f"Error connecting to database: {str(e)}")
              # Create dummy engine for testing/development if connection fails
              engine = create_engine("sqlite:///./test.db", connect_args={"check_same_thread": False})
              SessionLocal = sessionmaker(autocommit=False, autoflush=False, bind=engine)
              Base = declarative_base()

          def get_db():
              """Dependency for getting DB session"""
              db = SessionLocal()
              try:
                  yield db
              finally:
                  db.close()
          EOT
          
          # API package
          cat > /app/api/__init__.py << 'EOT'
          from .main import app
          EOT
          
          # Routers package
          cat > /app/api/routers/__init__.py << 'EOT'
          # Router package
          EOT
          
          # Core modules
          cat > /app/core/logger.py << 'EOT'
          """
          Logger Configuration Module
          Created: 2025-06-17 15:30:26
          Author: daparthi001
          """
          import logging
          import sys

          # Configure root logger
          logging.basicConfig(
              level=logging.INFO,
              format='%(asctime)s - %(name)s - %(levelname)s - %(message)s',
              stream=sys.stdout
          )

          # Create logger
          logger = logging.getLogger("quantumvestai_api")
          logger.setLevel(logging.INFO)

          # Ensure we don't add multiple handlers if module is reloaded
          if not logger.handlers:
              # Create console handler
              handler = logging.StreamHandler(sys.stdout)
              handler.setLevel(logging.INFO)
              
              # Create formatter
              formatter = logging.Formatter('%(asctime)s - %(name)s - %(levelname)s - %(message)s')
              handler.setFormatter(formatter)
              
              # Add handler to logger
              logger.addHandler(handler)
              
              logger.info("Logger initialized")
          EOT

          # Auth router
          cat > /app/api/routers/auth.py << 'EOT'
          """
          Authentication Router
          Created: 2025-06-17 15:30:26
          Author: daparthi001
          """
          from fastapi import APIRouter, Request, Response, status
          from fastapi.responses import JSONResponse
          from core.logger import logger
          from datetime import datetime
          import traceback
          import json

          router = APIRouter()

          @router.post("/register", status_code=status.HTTP_200_OK)
          async def register(request: Request, response: Response):
              """
              User registration endpoint
              """
              # Set CORS headers
              response.headers["Access-Control-Allow-Origin"] = "*"
              response.headers["Access-Control-Allow-Methods"] = "POST, OPTIONS"
              response.headers["Access-Control-Allow-Headers"] = "Content-Type, Authorization"
              
              try:
                  # Log raw request data
                  body = await request.body()
                  logger.info(f"Registration request received, length: {len(body)}")
                  
                  try:
                      # Parse JSON data
                      data = await request.json()
                      username = data.get("username")
                      email = data.get("email")
                      password = data.get("password")
                      
                      logger.info(f"Registration request parsed for user: {username}")
                      
                      # Basic validation
                      if not username or not email or not password:
                          logger.warning(f"Missing required registration fields")
                          return JSONResponse(
                              status_code=status.HTTP_200_OK,
                              content={
                                  "status": "error",
                                  "message": "Username, email and password are required"
                              }
                          )
                      
                      # In production: check if user exists, hash password, store in database
                      
                      # Return success response
                      logger.info(f"Registration successful for user: {username}")
                      return {
                          "status": "success",
                          "message": "Registration successful",
                          "username": username,
                          "timestamp": datetime.utcnow().isoformat()
                      }
                      
                  except json.JSONDecodeError as json_error:
                      logger.error(f"JSON parse error: {str(json_error)}")
                      logger.error(f"Raw request: {body.decode('utf-8', errors='replace')}")
                      
                      return JSONResponse(
                          status_code=status.HTTP_200_OK,
                          content={
                              "status": "error",
                              "message": "Invalid request format"
                          }
                      )
                      
              except Exception as e:
                  logger.error(f"Registration error: {str(e)}")
                  logger.error(traceback.format_exc())
                  
                  return JSONResponse(
                      status_code=status.HTTP_200_OK,
                      content={
                          "status": "error",
                          "message": "An unexpected error occurred"
                      }
                  )

          @router.options("/register")
          async def options_register(response: Response):
              """Handle CORS preflight requests"""
              response.headers["Access-Control-Allow-Origin"] = "*"
              response.headers["Access-Control-Allow-Methods"] = "POST, OPTIONS"
              response.headers["Access-Control-Allow-Headers"] = "Content-Type, Authorization"
              response.headers["Access-Control-Max-Age"] = "86400"
              
              return Response(
                  status_code=200,
                  content="",
                  media_type="text/plain"
              )

          @router.get("/status")
          async def auth_status(response: Response):
              """Auth status endpoint"""
              response.headers["Access-Control-Allow-Origin"] = "*"
              
              return {
                  "status": "active",
                  "version": "2025.06.17.4",
                  "timestamp": datetime.utcnow().isoformat()
              }
          EOT
          
          # Main FastAPI application - BARE MINIMUM VERSION
          cat > /app/api/main.py << 'EOT'
          """
          Main Application Module - Bare Minimum Version
          Created: 2025-06-17 15:30:26
          Author: daparthi001
          """
          from fastapi import FastAPI, Request, Response
          from fastapi.middleware.cors import CORSMiddleware
          from sqlalchemy import text
          from datetime import datetime
          
          # Import components
          from db.session import engine
          from core.logger import logger
          
          # Create FastAPI application
          app = FastAPI(
              title="QuantumVestAI API",
              description="Stock Market Analysis and Investment Platform API",
              version="1.0.0"
          )
          
          # Setup CORS middleware directly with values
          app.add_middleware(
              CORSMiddleware,
              allow_origins=["*"],
              allow_credentials=True,
              allow_methods=["*"],
              allow_headers=["*"],
          )
          
          # Add request logging middleware
          @app.middleware("http")
          async def log_requests(request: Request, call_next):
              """Log all requests and responses"""
              path = request.url.path
              method = request.method
              
              logger.info(f"Request: {method} {path}")
              
              # Process the request
              start_time = datetime.utcnow()
              response = await call_next(request)
              duration = (datetime.utcnow() - start_time).total_seconds()
              
              # Log the response
              logger.info(f"Response: {method} {path} - Status: {response.status_code} - Duration: {duration:.3f}s")
              
              # Ensure CORS headers are set
              response.headers["Access-Control-Allow-Origin"] = "*"
              
              return response
          
          # Import routers
          from api.routers.auth import router as auth_router
          
          # Register routes
          app.include_router(auth_router, prefix="/auth", tags=["Authentication"])
          
          @app.get("/")
          async def root():
              """Root endpoint"""
              return {
                  "name": "QuantumVestAI API",
                  "version": "1.0.0",
                  "status": "online",
                  "timestamp": datetime.utcnow().isoformat()
              }
          
          @app.get("/health")
          async def health_check():
              """Health check endpoint"""
              try:
                  # Test database connection
                  with engine.connect() as conn:
                      result = conn.execute(text("SELECT 1")).scalar()
                      
                  return {
                      "status": "healthy",
                      "database": {
                          "status": "connected",
                          "result": result
                      },
                      "timestamp": datetime.utcnow().isoformat()
                  }
              except Exception as e:
                  logger.error(f"Health check failed: {str(e)}")
                  return {
                      "status": "unhealthy",
                      "database": {
                          "status": "disconnected",
                          "error": str(e)
                      },
                      "timestamp": datetime.utcnow().isoformat()
                  }
          EOT
          
          echo "=== Starting FastAPI Application ==="
          cd /app && uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: quantumvestai-cluster-rds-credentials
              key: host
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: quantumvestai-cluster-rds-credentials
              key: port
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: quantumvestai-cluster-rds-credentials
              key: database
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: quantumvestai-cluster-rds-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: quantumvestai-cluster-rds-credentials
              key: password
        - name: PYTHONPATH
          value: /app
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: API_ENV
          value: development
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          timeoutSeconds: 2
          periodSeconds: 60
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          timeoutSeconds: 2
          periodSeconds: 30
          failureThreshold: 3