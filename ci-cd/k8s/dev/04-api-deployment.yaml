# API Deployment Configuration
# Created: 2025-05-20 14:46:05
# Author: daparthi001

apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantumvestai-dev-api
  namespace: dev
  labels:
    app: quantumvestai
    tier: backend
    environment: development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quantumvestai
      tier: backend
  template:
    metadata:
      labels:
        app: quantumvestai
        tier: backend
    spec:
      initContainers:
      - name: wait-for-db
        image: postgres:13-alpine
        command: ["/scripts/wait-for-db.sh"]
        env:
        - name: DB_HOST
          value: "quantumvestai-dev.cwbsqsiywwaa.us-east-1.rds.amazonaws.com"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "dbadmin"
        - name: DB_NAME
          value: "quantumvestaidb"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: quantumvestai-cluster-rds-credentials
              key: password
        volumeMounts:
        - name: db-check-scripts
          mountPath: /scripts
      containers:
      - name: api
        image: 921930869047.dkr.ecr.us-east-1.amazonaws.com/quantumvestai:api-dev-latest
        imagePullPolicy: Always
        env:
        - name: DB_HOST
          value: "quantumvestai-dev.cwbsqsiywwaa.us-east-1.rds.amazonaws.com"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "dbadmin"
        - name: DB_NAME
          value: "quantumvestaidb"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: quantumvestai-cluster-rds-credentials
              key: password
        ports:
        - containerPort: 8000
      volumes:
      - name: db-check-scripts
        configMap:
          name: db-check-scripts
          defaultMode: 0755