# Development API Deployment
# Created: 2025-05-20 07:24:47
# Author: daparthi001

apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantumvestai-dev-api
  namespace: dev
  labels:
    environment: development
    app: quantumvestai
    tier: backend
    created-by: daparthi001
    created-date: "2025-05-20"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quantumvestai
      tier: backend
      environment: development
  template:
    metadata:
      labels:
        app: quantumvestai
        tier: backend
        environment: development
    spec:
      containers:
        - name: api
          image: quantumvest-api:dev
          imagePullPolicy: Always
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: quantumvestai-cluster-rds-credentials
                  key: POSTGRES_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: quantumvestai-cluster-rds-credentials
                  key: POSTGRES_PORT
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: quantumvestai-cluster-rds-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quantumvestai-cluster-rds-credentials
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: quantumvestai-cluster-rds-credentials
                  key: POSTGRES_DB