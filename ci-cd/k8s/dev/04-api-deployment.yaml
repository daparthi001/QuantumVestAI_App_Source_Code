apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantumvestai-dev-api
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quantumvestai
      tier: backend
  template:
    metadata:
      labels:
        app: quantumvestai
        tier: backend
    spec:
      containers:
      - name: api
        image: 921930869047.dkr.ecr.us-east-1.amazonaws.com/quantumvestai:api-dev-latest
        imagePullPolicy: Always
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "=== Creating API Structure ==="
            # Create api directory and main.py
            mkdir -p /app/api
            
            # Create __init__.py
            cat > /app/api/__init__.py << 'EOF'
            from .main import app
            EOF
            
            # Create main.py with updated configuration
            cat > /app/api/main.py << 'EOF'
            """
            Main Application Module
            Created: 2025-05-22 04:11:37
            Author: daparthi001
            """
            import logging
            from fastapi import FastAPI, Depends
            from sqlalchemy.orm import Session
            from core.config import settings
            from core.middleware import setup_middleware
            from db.session import get_db

            # Configure logging
            logging.basicConfig(
                level=logging.INFO,
                format='%(asctime)s - %(levelname)s - %(message)s'
            )
            logger = logging.getLogger(__name__)

            app = FastAPI(
                title=settings.PROJECT_NAME,
                description=settings.DESCRIPTION,
                version=settings.VERSION
            )

            # Setup middleware
            setup_middleware(app)

            @app.on_event("startup")
            async def startup_event():
                """Startup event handler"""
                logger.info("Starting QuantumVestAI API...")

            @app.get("/health")
            async def health_check(db: Session = Depends(get_db)):
                """Health check endpoint"""
                try:
                    # Test database connection
                    result = db.execute("SELECT version()").scalar()
                    return {
                        "status": "healthy",
                        "database": {
                            "status": "connected",
                            "version": result
                        },
                        "environment": settings.API_ENV
                    }
                except Exception as e:
                    logger.error("Health check failed: %s", str(e))
                    return {
                        "status": "unhealthy",
                        "database": {
                            "status": "disconnected",
                            "error": str(e)
                        },
                        "environment": settings.API_ENV
                    }

            # Import and include routers here
            # from api.routers import stocks, users, etc.
            EOF
            
            echo "=== Starting FastAPI Application ==="
            cd /app && uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
        env:
        # Database configuration from secret
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: quantumvestai-cluster-rds-credentials
              key: host
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: quantumvestai-cluster-rds-credentials
              key: port
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: quantumvestai-cluster-rds-credentials
              key: database
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: quantumvestai-cluster-rds-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: quantumvestai-cluster-rds-credentials
              key: password
        
        # Application configuration
        - name: PYTHONPATH
          value: "/app"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: API_ENV
          value: "development"
        
        ports:
        - containerPort: 8000
        
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 60