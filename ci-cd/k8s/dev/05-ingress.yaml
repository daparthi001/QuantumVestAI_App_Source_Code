# Development Ingress
# Created: 2025-05-20 06:14:34
# Author: daparthi001

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quantumvestai-ingress
  namespace: dev
  labels:
    environment: development
    app: quantumvestai
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
spec:
  rules:
    - host: dev-api.quantumvest.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quantumvestai-api
                port:
                  number: 8000