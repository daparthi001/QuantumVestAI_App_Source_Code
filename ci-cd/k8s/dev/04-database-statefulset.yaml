# Development Database StatefulSet
# Created: 2025-05-20 06:12:45
# Author: daparthi001

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: quantumvest-dev-db
  namespace: quantumvest-dev
  labels:
    environment: development
    app: quantumvest
    tier: database
spec:
  serviceName: quantumvest-dev-db
  replicas: 1
  selector:
    matchLabels:
      app: quantumvest
      tier: database
      environment: development
  template:
    metadata:
      labels:
        app: quantumvest
        tier: database
        environment: development
    spec:
      containers:
        - name: postgres
          image: postgres:13-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: quantumvest-dev-config
            - secretRef:
                name: quantumvest-dev-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - quantumvest
            initialDelaySeconds: 30
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi