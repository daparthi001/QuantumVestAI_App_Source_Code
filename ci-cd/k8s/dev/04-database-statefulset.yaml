# Development Database StatefulSet
# Created: 2025-05-20 06:58:40
# Author: daparthi001

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: quantumvestai-dev-db
  namespace: dev
  labels:
    environment: development
    app: quantumvestai
    tier: database
    created-by: daparthi001
    created-date: "2025-05-20"
spec:
  serviceName: quantumvestai-dev-db
  replicas: 1
  selector:
    matchLabels:
      app: quantumvestai
      tier: database
      environment: development
  template:
    metadata:
      labels:
        app: quantumvestai
        tier: database
        environment: development
    spec:
      containers:
        - name: postgres
          image: postgres:13-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: quantumvestai-cluster-rds-credentials
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          environment: development
          app: quantumvestai
          tier: database
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: ebs-sc
        resources:
          requests:
            storage: 10Gi