# PostgreSQL StatefulSet Configuration
# Created: 2025-05-20 08:27:15
# Author: daparthi001

apiVersion: v1
kind: Service
metadata:
  name: quantumvestai-dev-db
  namespace: dev
  labels:
    app: quantumvestai
    tier: database
    environment: development
spec:
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
  clusterIP: None
  selector:
    app: quantumvestai
    tier: database
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: quantumvestai-dev-db
  namespace: dev
  labels:
    app: quantumvestai
    tier: database
    environment: development
    created-by: daparthi001
    created-date: "2025-05-20"
spec:
  serviceName: quantumvestai-dev-db
  replicas: 1
  selector:
    matchLabels:
      app: quantumvestai
      tier: database
      environment: development
  template:
    metadata:
      labels:
        app: quantumvestai
        tier: database
        environment: development
    spec:
      containers:
      - name: postgres
        image: postgres:13-alpine
        env:
        # Required PostgreSQL initialization variables
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: quantumvestai-cluster-rds-credentials
              key: host
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: quantumvestai-cluster-rds-credentials
              key: port
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: quantumvestai-cluster-rds-credentials
              key: database
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: quantumvestai-cluster-rds-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: quantumvestai-cluster-rds-credentials
              key: password
        # Additional PostgreSQL configuration
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        # Connection settings
        - name: POSTGRES_HOST_AUTH_METHOD
          value: "md5"
        - name: POSTGRES_INITDB_ARGS
          value: "--auth-host=md5"
        ports:
        - containerPort: 5432
          name: postgres
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - dbadmin
            - -d
            - quantumvestaidb
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - dbadmin
            - -d
            - quantumvestaidb
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: init-scripts
        configMap:
          name: postgres-init-scripts
          defaultMode: 0755
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: dev
  labels:
    app: quantumvestai
    tier: database
    environment: development
data:
  01-init.sql: |
    -- Initialize database schema
    CREATE TABLE IF NOT EXISTS users (
        id SERIAL PRIMARY KEY,
        username VARCHAR(50) UNIQUE NOT NULL,
        email VARCHAR(255) UNIQUE NOT NULL,
        created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS portfolios (
        id SERIAL PRIMARY KEY,
        user_id INTEGER REFERENCES users(id),
        name VARCHAR(100) NOT NULL,
        description TEXT,
        created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP
    );

    -- Create indexes
    CREATE INDEX IF NOT EXISTS idx_users_username ON users(username);
    CREATE INDEX IF NOT EXISTS idx_portfolios_user_id ON portfolios(user_id);

    -- Insert initial test data
    INSERT INTO users (username, email)
    VALUES ('testuser', 'test@quantumvest.ai')
    ON CONFLICT (username) DO NOTHING;