apiVersion: batch/v1
kind: CronJob
metadata:
  name: quantumvestai-model-retrain
spec:
  schedule: "0 0 * * *"  # Run daily at midnight
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: model-retrain
            image: 921930869047.dkr.ecr.us-east-1.amazonaws.com/quantumvestai:latest
            imagePullPolicy: IfNotPresent
            command:
            - python
            - retrain.py
            resources:
              requests:
                memory: "2Gi"
                cpu: "1000m"
              limits:
                memory: "4Gi"
                cpu: "2000m"
            env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: quantumvestai-secrets
                  key: jwt-secret-key
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: quantumvestai-secrets
                  key: admin-api-key
            - name: TWITTER_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: quantumvestai-secrets
                  key: twitter-bearer-token
                  optional: true
            # - name: SLACK_WEBHOOK
            #   valueFrom:
            #     secretKeyRef:
            #       name: quantumvestai-secrets
            #       key: slack-webhook
            #       optional: true
            volumeMounts:
            - name: data-volume
              mountPath: /app/data
          restartPolicy: OnFailure
          volumes:
          - name: data-volume
            persistentVolumeClaim:
              claimName: quantumvestai-pvc