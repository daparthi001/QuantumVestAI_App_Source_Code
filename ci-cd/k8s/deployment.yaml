apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantumvestai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quantumvestai
  template:
    metadata:
      labels:
        app: quantumvestai
    spec:
      containers:
      - name: api
        image: <your_ecr_repo>/quantumvestai:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: quantumvestai-env