apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantumvestai
  labels:
    app: quantumvestai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quantumvestai
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: quantumvestai
    spec:
      containers:
      - name: quantumvestai
        image: 921930869047.dkr.ecr.us-east-1.amazonaws.com/quantumvestai:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        env:
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: quantumvestai-secrets
              key: jwt-secret-key
        - name: ADMIN_API_KEY
          valueFrom:
            secretKeyRef:
              name: quantumvestai-secrets
              key: admin-api-key
        - name: TWITTER_BEARER_TOKEN
          valueFrom:
            secretKeyRef:
              name: quantumvestai-secrets
              key: twitter-bearer-token
              optional: true
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: quantumvestai-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: quantumvestai
  labels:
    app: quantumvestai
spec:
  selector:
    app: quantumvestai
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quantumvestai
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - quantumvestai.example.com
    secretName: quantumvestai-tls
  rules:
  - host: quantumvestai.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: quantumvestai
            port:
              number: 80