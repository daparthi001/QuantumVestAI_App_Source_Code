apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantumvestai
  labels:
    app: quantumvestai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quantumvestai
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: quantumvestai
    spec:
      containers:
      - name: quantumvestai
        image: 921930869047.dkr.ecr.us-east-1.amazonaws.com/quantumvestai:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        env:
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: quantumvestai-secrets
              key: jwt-secret-key
        - name: ADMIN_API_KEY
          valueFrom:
            secretKeyRef:
              name: quantumvestai-secrets
              key: admin-api-key
        - name: TWITTER_BEARER_TOKEN
          valueFrom:
            secretKeyRef:
              name: quantumvestai-secrets
              key: twitter-bearer-token
              optional: true
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: quantumvestai-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: quantumvestai
  labels:
    app: quantumvestai
spec:
  selector:
    app: quantumvestai
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quantumvestai
  labels:
    app: quantumvestai
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    #alb.ingress.kubernetes.io/ssl-redirect: '443'
    # Set your ACM certificate ARN
    #alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:921930869047:certificate/5c7be917-ceec-4ba5-95bf-cfc28566bd4c
    # Optional group name to use the same ALB for multiple ingresses
    alb.ingress.kubernetes.io/group.name: quantumvestai
    # Health checks
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/success-codes: '200'
spec:
  rules:
  - host: quantumvestai.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: quantumvestai
            port:
              number: 80